<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Round 6: The Last Game</title>
<meta name="description" content="Jogo 2D em Canvas inspirado no universo de Round 6 / Squid Game.">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Semi+Condensed:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; }
:root {
  --bg: #07080b;
  --pink: #e8336d;
  --teal: #1f7a6d;
  --ink: #f2efe9;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  overflow: hidden;
  color: var(--ink);
  font-family: 'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}
#wrap {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, #10131a 0%, #050608 70%);
}
#game {
  display: block;
  outline: none;
  background: #000;
  box-shadow: 0 0 60px rgba(0, 0, 0, .8);
  cursor: default;
  image-rendering: auto;
}
#boot {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background: #050608;
  transition: opacity .6s ease;
  z-index: 2;
}
#boot.hide { opacity: 0; pointer-events: none; }
#boot p { letter-spacing: .5em; font-size: 14px; opacity: .7; margin: 0; }
#boot .shapes { display: flex; gap: 22px; }
#boot .shapes i { display: block; width: 34px; height: 34px; border: 4px solid var(--pink); animation: pulse 1.2s infinite ease-in-out; }
#boot .shapes i.c { border-radius: 50%; }
#boot .shapes i.t { border: none; width: 0; height: 0; border-left: 19px solid transparent; border-right: 19px solid transparent; border-bottom: 34px solid var(--pink); animation-delay: .2s; }
#boot .shapes i.s { animation-delay: .4s; }
@keyframes pulse { 0%, 100% { opacity: .25; transform: scale(.9); } 50% { opacity: 1; transform: scale(1); } }

</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" tabindex="0" aria-label="Round 6 — área do jogo"></canvas>
  <div id="boot"><div class="shapes"><i class="c"></i><i class="t"></i><i class="s"></i></div><p>CARREGANDO…</p></div>
</div>

<script>/* js/core/util.js */
/* ROUND 6 — util.js : math, random, easing, color and formatting helpers */
'use strict';
window.R6 = window.R6 || {};

(function () {
  const TAU = Math.PI * 2;

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  class RNG {
    constructor(seed) { this.seed = seed >>> 0; this.f = mulberry32(this.seed); }
    next() { return this.f(); }
    range(a, b) { return a + (b - a) * this.f(); }
    int(a, b) { return a + Math.floor(this.f() * (b - a + 1)); }
    pick(arr) { return arr[Math.floor(this.f() * arr.length)]; }
    chance(p) { return this.f() < p; }
    gauss(m = 0, s = 1) { const u = 1 - this.f(), v = this.f(); return m + s * Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }
    shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(this.f() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  }

  const ease = {
    linear: t => t,
    inQuad: t => t * t,
    outQuad: t => t * (2 - t),
    inOut: t => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
    inCubic: t => t * t * t,
    outCubic: t => (--t) * t * t + 1,
    inOutCubic: t => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    inBack: t => { const c1 = 1.70158, c3 = c1 + 1; return c3 * t * t * t - c1 * t * t; },
    outElastic: t => (t === 0 || t === 1) ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
    inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
    outExpo: t => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  };

  function hex2rgb(h) {
    if (h[0] === '#') h = h.slice(1);
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgb2hex(r, g, b) {
    const c = v => ('0' + Math.max(0, Math.min(255, Math.round(v))).toString(16)).slice(-2);
    return '#' + c(r) + c(g) + c(b);
  }
  const _colorCache = new Map();
  function mix(a, b, t) {
    const k = a + '|' + b + '|' + (Math.round(t * 100));
    let v = _colorCache.get(k);
    if (v) return v;
    const A = hex2rgb(a), B = hex2rgb(b);
    v = rgb2hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
    if (_colorCache.size > 4000) _colorCache.clear();
    _colorCache.set(k, v);
    return v;
  }
  function shade(c, amt) { return amt >= 0 ? mix(c, '#ffffff', amt) : mix(c, '#000000', -amt); }
  function rgba(c, a) { const A = hex2rgb(c); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; }
  function gray(c, t) {
    const A = hex2rgb(c); const g = A[0] * 0.3 + A[1] * 0.59 + A[2] * 0.11;
    return rgb2hex(A[0] + (g - A[0]) * t, A[1] + (g - A[1]) * t, A[2] + (g - A[2]) * t);
  }

  function hash(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  const U = {
    TAU,
    RNG,
    ease,
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    ilerp: (a, b, v) => (b === a ? 0 : (v - a) / (b - a)),
    smooth: t => { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); },
    rand: (a = 0, b = 1) => a + Math.random() * (b - a),
    randi: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
    chance: p => Math.random() < p,
    pick: arr => arr[Math.floor(Math.random() * arr.length)],
    shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; },
    dist: (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay),
    dist2: (ax, ay, bx, by) => (bx - ax) * (bx - ax) + (by - ay) * (by - ay),
    angTo: (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax),
    angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; },
    approach: (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t)),
    damp: (a, b, lambda, dt) => b + (a - b) * Math.exp(-lambda * dt),
    wave: (t, speed = 1, amp = 1, off = 0) => Math.sin(t * speed + off) * amp,
    hash,
    hex2rgb, rgb2hex, mix, shade, rgba, gray,
    pad: (n, w = 3) => String(Math.max(0, Math.floor(n))).padStart(w, '0'),
    money(n) {
      n = Math.max(0, Math.round(n));
      return '₩' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    },
    moneyShort(n) {
      if (n >= 1e9) return '₩' + (n / 1e9).toFixed(n >= 1e10 ? 1 : 2) + ' bi';
      if (n >= 1e6) return '₩' + (n / 1e6).toFixed(1) + ' mi';
      return U.money(n);
    },
    time(sec) {
      sec = Math.max(0, sec);
      const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    },
    wrap(ctx, text, maxW) {
      const out = [];
      const paras = String(text).split('\n');
      for (const para of paras) {
        const words = para.split(' ');
        let line = '';
        for (const w of words) {
          const test = line ? line + ' ' + w : w;
          if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; }
          else line = test;
        }
        out.push(line);
      }
      return out;
    },
    // segment/circle helpers
    pointSegDist(px, py, ax, ay, bx, by) {
      const dx = bx - ax, dy = by - ay; const l2 = dx * dx + dy * dy;
      let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
      return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
    },
    rectHit: (px, py, r) => px >= r.x && py >= r.y && px <= r.x + r.w && py <= r.y + r.h,
    weighted(items, wf, rnd = Math.random) {
      let tot = 0; for (const it of items) tot += Math.max(0, wf(it));
      let r = rnd() * tot;
      for (const it of items) { r -= Math.max(0, wf(it)); if (r <= 0) return it; }
      return items[items.length - 1];
    },
    // simple timed tween list used by scenes
    Tweens: class {
      constructor() { this.list = []; }
      add(obj, props, dur, easeFn = ease.inOut, onDone) {
        const from = {}; for (const k in props) from[k] = obj[k];
        const tw = { obj, props, from, dur: Math.max(0.0001, dur), t: 0, ease: easeFn, onDone };
        this.list.push(tw); return tw;
      }
      update(dt) {
        for (let i = this.list.length - 1; i >= 0; i--) {
          const tw = this.list[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur); const e = tw.ease(k);
          for (const p in tw.props) tw.obj[p] = tw.from[p] + (tw.props[p] - tw.from[p]) * e;
          if (k >= 1) { this.list.splice(i, 1); tw.onDone && tw.onDone(); }
        }
      }
      clear() { this.list.length = 0; }
      get busy() { return this.list.length > 0; }
    },
    // spatial hash for crowd separation
    Grid: class {
      constructor(cell = 32) { this.cell = cell; this.map = new Map(); }
      clear() { this.map.clear(); }
      key(cx, cy) { return (cx + 5000) * 10007 + (cy + 5000); }
      insert(o, x, y) {
        const k = this.key(Math.floor(x / this.cell), Math.floor(y / this.cell));
        let b = this.map.get(k); if (!b) { b = []; this.map.set(k, b); } b.push(o);
      }
      query(x, y, r, out) {
        out.length = 0;
        const c = this.cell, x0 = Math.floor((x - r) / c), x1 = Math.floor((x + r) / c), y0 = Math.floor((y - r) / c), y1 = Math.floor((y + r) / c);
        for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
          const b = this.map.get(this.key(cx, cy)); if (b) for (let i = 0; i < b.length; i++) out.push(b[i]);
        }
        return out;
      }
    },
  };

  R6.U = U;
})();

</script>
<script>/* js/core/input.js */
/* ROUND 6 — input.js : keyboard, mouse and touch */
'use strict';
(function () {
  const held = new Set();
  const pressed = new Set();
  const released = new Set();
  const mouse = { x: 640, y: 360, down: false, pressed: false, released: false, rdown: false, rpressed: false, rreleased: false, wheel: 0, moved: false, dx: 0, dy: 0 };

  const ACTIONS = {
    up: ['KeyW', 'ArrowUp'],
    down: ['KeyS', 'ArrowDown'],
    left: ['KeyA', 'ArrowLeft'],
    right: ['KeyD', 'ArrowRight'],
    run: ['ShiftLeft', 'ShiftRight'],
    action: ['Space'],
    jump: ['Space', 'KeyW', 'ArrowUp'],
    interact: ['KeyE'],
    confirm: ['Enter', 'Space', 'NumpadEnter'],
    back: ['Escape', 'Backspace'],
    pause: ['Escape', 'KeyP'],
    alt: ['KeyQ'],
    punch: ['KeyJ'],
    kick: ['KeyK'],
    grab: ['KeyL'],
    block: ['KeyI', 'ControlLeft'],
    dodge: ['ShiftLeft', 'ShiftRight'],
    tab: ['Tab'],
    sneak: ['KeyC', 'ControlLeft'],
    skip: ['Escape'],
    ff: ['Space', 'Enter'],
  };

  const Input = {
    mouse,
    lastDevice: 'kb',
    enabled: true,
    canvas: null,
    toLogical: null,
    down: code => held.has(code),
    pressed: code => pressed.has(code),
    released: code => released.has(code),
    act(name) { const k = ACTIONS[name]; if (!k) return false; for (let i = 0; i < k.length; i++) if (held.has(k[i])) return true; return false; },
    actP(name) { const k = ACTIONS[name]; if (!k) return false; for (let i = 0; i < k.length; i++) if (pressed.has(k[i])) return true; return false; },
    actR(name) { const k = ACTIONS[name]; if (!k) return false; for (let i = 0; i < k.length; i++) if (released.has(k[i])) return true; return false; },
    axis() {
      let x = 0, y = 0;
      if (Input.act('left')) x -= 1;
      if (Input.act('right')) x += 1;
      if (Input.act('up')) y -= 1;
      if (Input.act('down')) y += 1;
      if (Input.touchAxis && (Input.touchAxis.x || Input.touchAxis.y)) { x = Input.touchAxis.x; y = Input.touchAxis.y; }
      const l = Math.hypot(x, y);
      if (l > 1) { x /= l; y /= l; }
      return { x, y };
    },
    digitP() {
      for (let i = 1; i <= 9; i++) if (pressed.has('Digit' + i) || pressed.has('Numpad' + i)) return i;
      return 0;
    },
    anyP() { return pressed.size > 0 || mouse.pressed; },
    confirmP() { return Input.actP('confirm') || mouse.pressed; },
    endFrame() {
      pressed.clear(); released.clear();
      mouse.pressed = false; mouse.released = false; mouse.rpressed = false; mouse.rreleased = false;
      mouse.wheel = 0; mouse.moved = false; mouse.dx = 0; mouse.dy = 0;
    },
    clearAll() { held.clear(); pressed.clear(); released.clear(); mouse.down = false; mouse.rdown = false; },
    touchAxis: null,
    onKeyHooks: [],
    init(canvas, toLogical) {
      Input.canvas = canvas; Input.toLogical = toLogical;
      window.addEventListener('keydown', e => {
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Backspace'].includes(e.code)) e.preventDefault();
        R6.Audio && R6.Audio.unlock();
        Input.lastDevice = 'kb';
        if (!held.has(e.code)) pressed.add(e.code);
        held.add(e.code);
        for (const h of Input.onKeyHooks) h(e);
      });
      window.addEventListener('keyup', e => { held.delete(e.code); released.add(e.code); });
      window.addEventListener('blur', () => { held.clear(); mouse.down = false; mouse.rdown = false; });
      const setPos = (cx, cy) => {
        const p = toLogical(cx, cy);
        mouse.dx += p.x - mouse.x; mouse.dy += p.y - mouse.y;
        mouse.x = p.x; mouse.y = p.y; mouse.moved = true;
      };
      canvas.addEventListener('mousemove', e => { setPos(e.clientX, e.clientY); Input.lastDevice = 'mouse'; });
      canvas.addEventListener('mousedown', e => {
        R6.Audio && R6.Audio.unlock();
        canvas.focus();
        setPos(e.clientX, e.clientY);
        Input.lastDevice = 'mouse';
        if (e.button === 2) { mouse.rdown = true; mouse.rpressed = true; }
        else { mouse.down = true; mouse.pressed = true; }
      });
      window.addEventListener('mouseup', e => {
        if (e.button === 2) { mouse.rdown = false; mouse.rreleased = true; }
        else { mouse.down = false; mouse.released = true; }
      });
      canvas.addEventListener('contextmenu', e => e.preventDefault());
      canvas.addEventListener('wheel', e => { mouse.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
      // touch: on-screen controls (R6.Touch) take their touches; any other touch acts as the mouse
      let mouseTouch = null;
      canvas.addEventListener('touchstart', e => {
        R6.Audio && R6.Audio.unlock(); Input.lastDevice = 'touch'; e.preventDefault(); canvas.focus();
        for (const t of e.changedTouches) {
          const p = toLogical(t.clientX, t.clientY);
          if (R6.Touch && R6.Touch.start(t, p)) continue;
          if (mouseTouch != null) continue;
          mouseTouch = t.identifier; setPos(t.clientX, t.clientY); mouse.down = true; mouse.pressed = true;
        }
      }, { passive: false });
      canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        for (const t of e.changedTouches) { const p = toLogical(t.clientX, t.clientY); if (R6.Touch && R6.Touch.move(t, p)) continue; if (t.identifier === mouseTouch) setPos(t.clientX, t.clientY); }
      }, { passive: false });
      const tend = e => {
        e.preventDefault();
        for (const t of e.changedTouches) { if (R6.Touch && R6.Touch.end(t)) continue; if (t.identifier === mouseTouch) { mouse.down = false; mouse.released = true; mouseTouch = null; } }
      };
      canvas.addEventListener('touchend', tend, { passive: false });
      canvas.addEventListener('touchcancel', tend, { passive: false });
    },
    // for automated tests
    simKey(code, down) {
      if (down) { if (!held.has(code)) pressed.add(code); held.add(code); }
      else { held.delete(code); released.add(code); }
    },
    simTap(code) { pressed.add(code); held.add(code); setTimeout(() => { held.delete(code); released.add(code); }, 60); },
    keyName(action) {
      const map = { KeyW: 'W', KeyA: 'A', KeyS: 'S', KeyD: 'D', Space: 'ESPAÇO', Enter: 'ENTER', Escape: 'ESC', KeyE: 'E', KeyQ: 'Q', ShiftLeft: 'SHIFT', KeyJ: 'J', KeyK: 'K', KeyL: 'L', KeyI: 'I', Tab: 'TAB', KeyC: 'C' };
      const k = ACTIONS[action]; return k ? (map[k[0]] || k[0]) : action;
    },
  };
  R6.Input = Input;
})();

</script>
<script>/* js/core/audio.js */
/* ROUND 6 — audio.js : procedural WebAudio SFX, ambience loops and a small dynamic music sequencer (all original) */
'use strict';
(function () {
  const A = {
    ctx: null, ok: false, master: null, music: null, sfxBus: null, amb: null, rev: null, comp: null,
    noiseBuf: null, vol: { master: 0.8, music: 0.55, sfx: 0.8 },
    loops: new Map(), lastPlay: new Map(), muted: false,
  };

  A.unlock = function () {
    if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const ctx = new AC();
      A.ctx = ctx;
      A.comp = ctx.createDynamicsCompressor();
      A.comp.threshold.value = -14; A.comp.ratio.value = 4; A.comp.attack.value = 0.005; A.comp.release.value = 0.2;
      A.master = ctx.createGain(); A.master.gain.value = A.vol.master;
      A.master.connect(A.comp); A.comp.connect(ctx.destination);
      A.music = ctx.createGain(); A.music.gain.value = A.vol.music; A.music.connect(A.master);
      A.sfxBus = ctx.createGain(); A.sfxBus.gain.value = A.vol.sfx; A.sfxBus.connect(A.master);
      A.amb = ctx.createGain(); A.amb.gain.value = A.vol.sfx * 0.8; A.amb.connect(A.master);
      // noise buffer
      const len = ctx.sampleRate * 2;
      const nb = ctx.createBuffer(1, len, ctx.sampleRate); const d = nb.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      A.noiseBuf = nb;
      // reverb impulse
      const rl = Math.floor(ctx.sampleRate * 2.4);
      const ir = ctx.createBuffer(2, rl, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const ch = ir.getChannelData(c); for (let i = 0; i < rl; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / rl, 2.6); }
      A.rev = ctx.createConvolver(); A.rev.buffer = ir;
      A.revGain = ctx.createGain(); A.revGain.gain.value = 0.35;
      A.rev.connect(A.revGain); A.revGain.connect(A.master);
      A.ok = true;
      A.applyVolumes();
      if (A._pendingMusic) { const p = A._pendingMusic; A._pendingMusic = null; Music.play(p.name, p.fade); }
      for (const [name, l] of A._pendingLoops) A.loop(name, l);
      A._pendingLoops.clear();
    } catch (e) { console.warn('Audio init failed', e); }
  };
  A._pendingLoops = new Map();

  A.applyVolumes = function () {
    if (!A.ok) return;
    const t = A.ctx.currentTime;
    A.master.gain.setTargetAtTime(A.muted ? 0 : A.vol.master, t, 0.05);
    A.music.gain.setTargetAtTime(A.vol.music * (Music.duckV || 1), t, 0.1);
    A.sfxBus.gain.setTargetAtTime(A.vol.sfx, t, 0.05);
    A.amb.gain.setTargetAtTime(A.vol.sfx * 0.8, t, 0.05);
  };
  A.setVolumes = function (v) { Object.assign(A.vol, v); A.applyVolumes(); };

  // ---------- low level helpers ----------
  function env(g, t, a, d, s, r, peak = 1, hold = 0) {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);

/* ROUND 6 — save.js : settings, meta progression (shop/gallery/endings) and campaign checkpoints in localStorage */
'use strict';
(function () {
  const KEY_SAVE = 'r6_save_v1', KEY_META = 'r6_meta_v1', KEY_SET = 'r6_settings_v1';
  function read(k) { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function del(k) { try { localStorage.removeItem(k); } catch (e) { } }

  const defaultsSettings = { master: 0.8, music: 0.55, sfx: 0.8, difficulty: 'normal', textSpeed: 1, shake: true, hints: true, fullscreen: false, subtitles: true };
  const defaultsMeta = {
    chips: 0, totalEarned: 0,
    owned: { outfit_default: true, title_none: true, ui_default: true, fx_default: true, emote_wave: true, track_menu: true, anim_default: true },
    equipped: { outfit: 'outfit_default', title: 'title_none', ui: 'ui_default', fx: 'fx_default', track: 'track_menu', anim: 'anim_default', number: null },
    endings: {}, gallery: {}, scenes: {}, seasonsUnlocked: 1, gamesUnlocked: { ddakji: true },
    best: {}, stats: { eliminatedSeen: 0, gamesWon: 0, deaths: 0, playTime: 0 },
  };

  const Save = {
    settings: Object.assign({}, defaultsSettings, read(KEY_SET) || {}),
    meta: null,
    saveSettings() { write(KEY_SET, Save.settings); R6.Audio && R6.Audio.setVolumes({ master: Save.settings.master, music: Save.settings.music, sfx: Save.settings.sfx }); },
    loadMeta() {
      const m = read(KEY_META) || {};
      const d = JSON.parse(JSON.stringify(defaultsMeta));
      Save.meta = Object.assign(d, m);
      Save.meta.owned = Object.assign(d.owned, m.owned || {});
      Save.meta.equipped = Object.assign(JSON.parse(JSON.stringify(defaultsMeta.equipped)), m.equipped || {});
      Save.meta.stats = Object.assign(JSON.parse(JSON.stringify(defaultsMeta.stats)), m.stats || {});
      Save.meta.gamesUnlocked = Object.assign({ ddakji: true }, m.gamesUnlocked || {});
      return Save.meta;
    },
    saveMeta() { write(KEY_META, Save.meta); },
    hasCampaign() { const s = read(KEY_SAVE); return !!(s && s.state); },
    readCampaign() { return read(KEY_SAVE); },
    writeCampaign(data) { data.savedAt = Date.now(); return write(KEY_SAVE, data); },
    clearCampaign() { del(KEY_SAVE); },
    resetAll() { del(KEY_SAVE); del(KEY_META); Save.loadMeta(); },
    unlockGame(id) { if (!Save.meta.gamesUnlocked[id]) { Save.meta.gamesUnlocked[id] = true; Save.saveMeta(); } },
    unlockScene(id, title) { if (!Save.meta.scenes[id]) { Save.meta.scenes[id] = title || id; Save.saveMeta(); } },
    unlockGallery(id) { if (!Save.meta.gallery[id]) { Save.meta.gallery[id] = true; Save.saveMeta(); } },
    unlockEnding(id) { Save.meta.endings[id] = (Save.meta.endings[id] || 0) + 1; Save.saveMeta(); },
    addChips(n) { n = Math.max(0, Math.floor(n)); Save.meta.chips += n; Save.meta.totalEarned += n; Save.saveMeta(); return n; },
    best(id, score, higherBetter = true) {
      const b = Save.meta.best[id];

      return false;
    },
    diff() { return Save.settings.difficulty || 'normal'; },
    // difficulty multiplier helper: pick(normal, hard, extreme)
    D(n, h, x) { const d = Save.diff(); return d === 'extreme' ? x : d === 'hard' ? h : n; },

  Save.loadMeta();

})();

    tick(rdt) {

      R6.Banner.update(rdt); R6.Toast.update(rdt); if (R6.Elim) R6.Elim.update(rdt);

    render() {

    // ---------- scene management ----------

    swap(scene, o = {}) {

      if (!o.keepLoops) R6.Audio.stopAllLoops(0.5);
      E.timers.length = 0; E.timeScale = 1; E.slow = null; E.paused = false;

      R6.Input.clearAll();

    updateTrans(rdt) {

        return;
      }
      if (!tr.swapped && tr.t >= half) { tr.swapped = true; E.swap(tr.to, tr.o); tr.phase = 'in'; }

    },
    renderTrans(ctx) {

        const f = (cur && cur.focus && cur.focus()) || { x: R6.W / 2, y: R6.H / 2 };

        ctx.save(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.rect(0, 0, R6.W, R6.H); ctx.arc(f.x, f.y, Math.max(0.1, r), 0, U.TAU, true); ctx.fill(); ctx.restore();
      } else {
        ctx.save(); ctx.globalAlpha = U.ease.inOut(a); ctx.fillStyle = tr.color; ctx.fillRect(0, 0, R6.W, R6.H); ctx.restore();
      }
    },
    // View-shift: top-down → side-view (or back). Zoom into the player, the floor plane tilts away to the horizon,
    // the player card-flips from 3/4 view to profile, then the new arena unfolds from the horizon around them.
    renderViewShift(ctx, tr) {
      const t = tr.t / tr.dur; const fF = tr.focusFrom, fT = tr.focusTo;
      const W = R6.W, H = R6.H;
      const p1 = U.clamp(t / 0.34, 0, 1), p2 = U.clamp((t - 0.34) / 0.28, 0, 1), p3 = U.clamp((t - 0.62) / 0.38, 0, 1);

        const z = 1 + U.ease.inCubic(p1) * 0.9;
        const sq = 1 - U.ease.inOutCubic(p2) * 0.94;
        const cx = U.lerp(fF.x, W / 2, U.ease.inOut(p1)), cy = U.lerp(fF.y, H * 0.55, U.ease.inOut(p1));

        // slice-based perspective tilt: upper rows compress more
        const slices = 24;
        for (let i = 0; i < slices; i++) {
          const sy = i / slices * H, sh = H / slices;
          const rel = (sy - fF.y) / H; // negative above focus
          const persp = 1 + Math.max(0, -rel) * p2 * 1.6;
          const dy0 = cy + (sy - fF.y) * z * sq / persp;
          const dy1 = cy + (sy + sh - fF.y) * z * sq / (1 + Math.max(0, -(rel + 1 / slices)) * p2 * 1.6);
          const wS = z / (1 + Math.max(0, -rel) * p2 * 0.5);
          const dx = cx - fF.x * wS;
          ctx.drawImage(E.bufA, 0, sy, W, sh + 1, dx, dy0, W * wS, Math.max(0.5, dy1 - dy0) + 0.5);
        }
        ctx.restore();

        if (p1 > 0.4) {

      if (fF.look && t < 0.9) {
        const k = U.clamp((t - 0.2) / 0.55, 0, 1);
        const flip = Math.cos(k * Math.PI); // 1 → -1
        const x = U.lerp(W / 2, fT.x, U.ease.inOut(k));
        const y = U.lerp(H * 0.55 + 20, fT.y, U.ease.inOut(k));

        R6.Char.draw(ctx, fF.look, 0, 0, { view: flip > 0 ? 'front' : 'side', dir: fT.facing || 1, anim: 'walk', t: E.rt, scale: sc, shadow: false });
        ctx.restore();
      }
      // vignette + bars for a cinematic feel
      R6.UI.vignette(ctx, 0.7);
      R6.UI.letterbox(ctx, Math.sin(Math.min(1, t) * Math.PI));
    },

    after(sec, fn) { E.timers.push({ t: sec, fn }); },
    slowmo(scale, dur) { E.timeScale = scale; E.slow = { t: 0, dur }; },
    flash(color = '#fff', dur = 0.3) { E.flashC = color; E.flashT = dur; E.flashD = dur; },
    shake(m, d) { if (R6.Save && !R6.Save.settings.shake) m *= 0.15; E.shakeM = Math.max(m, E.shakeT > 0 ? E.shakeM : 0); E.shakeT = Math.max(E.shakeT, d); },
    pause(on) {
      if (on === E.paused) return;
      E.paused = on;
      if (on) { R6.Audio.sfx('back'); R6.Music.duck(0.35); R6.PauseMenu && R6.PauseMenu.open(); }
      else { R6.Music.duck(1); R6.Input.clearAll(); }
    },
  };
  R6.Engine = E;
})();

<script>/* js/core/touch.js */
/* ROUND 6 — touch.js : on-screen controls for phones/tablets — floating joystick (left), action buttons (right),
   pause/skip/relations shortcuts, a back button in menus, and a DOM text prompt for typing names/numbers */
'use strict';
(function () {
  const U = R6.U, TAU = U.TAU;
  const STICK_R = 70;

  const T = {
    on: false, touches: new Map(), stick: null, dirs: new Set(), pressedBtn: new Set(),
    portrait: false,
    mode() {
      const E = R6.Engine, sc = E.scene;
      if (!sc) return 'menu';
      if (E.paused) return 'paused';
      if (!sc.pausable) return 'menu';
      return 'play';
    },
    stickActive() {
      const E = R6.Engine, sc = E.scene;
      if (T.mode() !== 'play' || E.trans || (R6.Dialog.active && !(R6.Dialog.cur && R6.Dialog.cur.auto))) return false;
      if (sc.runner && sc.runner.update) return false;
      if (sc.phase === 'rules' || sc.phase === 'result') return false;
      return true;
    },
    buttons() {
      const m = T.mode(), sc = R6.Engine.scene;
      if (m === 'paused') return [];
      if (m === 'menu') return sc && (sc.name === 'menu' || sc.name === 'credits' || sc.name === 'winner') ? [] : [{ code: 'Escape', label: 'VOLTAR', x: 1206, y: 664, r: 30 }];
      const B = [
        { code: 'Space', label: 'ESPAÇO', x: 1182, y: 612, r: 50 },
        { code: 'KeyE', label: 'E', x: 1076, y: 652, r: 36 },
        { code: 'ShiftLeft', label: 'SHIFT', x: 1090, y: 546, r: 34 },
        { code: 'KeyQ', label: 'Q', x: 1186, y: 498, r: 30 },
        { code: 'KeyP', label: 'II', x: 318, y: 46, r: 22 },
        { code: 'Escape', label: 'ESC', x: 372, y: 46, r: 22 },
      ];
      // extra keys only where they are used: combat/stealth games and the dorm
      const n = sc && sc.name || '';
      if (/squidfinal|skysquid|revolt|escape|hideseek|sixlegs|stone|jegi|top|gonggi|hub/.test(n)) {
        ['J', 'K', 'L', 'I', 'C'].forEach((k, i) => B.push({ code: 'Key' + k, label: k, x: 1000 + i * 52, y: 426, r: 22 }));
      }
      if (n.startsWith('hub')) B.push({ code: 'Tab', label: 'TAB', x: 426, y: 46, r: 22 });
      if (n === 'tugofwar') B.push({ code: 'Digit1', label: '1', x: 1000, y: 426, r: 26 }, { code: 'Digit2', label: '2', x: 1060, y: 426, r: 26 });
      return B;
    },
    hit(p) { return T.buttons().find(b => (p.x - b.x) ** 2 + (p.y - b.y) ** 2 <= (b.r + 10) ** 2); },
    // ---- event routing (called by input.js); return true when the touch is consumed here
    start(t, p) {

    },
    move(t, p) {

    },
    end(t) {

      T.touches.delete(t.identifier);

      if (s.kind === 'stick') { T.stick = null; R6.Input.touchAxis = null; for (const k of T.dirs) R6.Input.simKey(k, false); T.dirs.clear(); }
      return true;
    },
    updStick() {
      const s = T.stick; let dx = s.x - s.ox, dy = s.y - s.oy; const l = Math.hypot(dx, dy);

    },
    // ---- drawing (screen space, on top of everything)
    draw(ctx) {
      if (!T.on) return;
      ctx.save();
      for (const b of T.buttons()) {
        const down = T.pressedBtn.has(b.code);
        ctx.globalAlpha = down ? 0.9 : 0.55;
        ctx.fillStyle = down ? 'rgba(232,51,109,.75)' : 'rgba(10,12,16,.45)'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.stroke();
        R6.UI.text(ctx, b.label, b.x, b.y + 1, { size: b.label.length > 3 ? Math.max(10, b.r * 0.34) : b.r * 0.62, align: 'center', base: 'middle', color: '#fff', weight: 800 });
      }
      ctx.globalAlpha = 1;
      const s = T.stick;
      if (s) {
        ctx.globalAlpha = 0.6; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.fillStyle = 'rgba(10,12,16,.35)';
        ctx.beginPath(); ctx.arc(s.ox, s.oy, STICK_R, 0, TAU); ctx.fill(); ctx.stroke();

      } else if (T.stickActive()) {
        ctx.globalAlpha = 0.22; ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(170, 570, STICK_R, 0, TAU); ctx.stroke();
        ctx.beginPath(); ctx.arc(170, 570, 26, 0, TAU); ctx.stroke();
        R6.UI.text(ctx, 'MOVER', 170, 574, { size: 13, align: 'center', base: 'middle', color: '#fff', weight: 800 });
      }
      ctx.restore();
      if (window.innerHeight > window.innerWidth) {
        ctx.save(); ctx.fillStyle = 'rgba(232,51,109,.92)'; ctx.fillRect(0, 0, R6.W, 44);
        R6.UI.text(ctx, '↻ Gire o aparelho para a horizontal para jogar melhor', R6.W / 2, 29, { size: 20, align: 'center', color: '#fff', weight: 800 });
        ctx.restore();
      }
    },
    get isTouch() { return T.on || ('ontouchstart' in window) || navigator.maxTouchPoints > 0; },
  };

  // DOM text prompt (brings up the phone keyboard); cb(value|null)
  R6.textPrompt = function (title, initial, o, cb) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);padding:16px;';
    const box = document.createElement('form');
    box.style.cssText = 'display:flex;flex-direction:column;gap:12px;width:min(420px,100%);padding:20px;background:#0c0e14;border:1px solid rgba(232,51,109,.6);border-radius:8px;font-family:"Barlow Semi Condensed",Arial,sans-serif;color:#f2efe9;';
    const lab = document.createElement('label'); lab.textContent = title; lab.htmlFor = 'r6-prompt'; lab.style.cssText = 'font-weight:800;letter-spacing:.15em;font-size:14px;color:#bbb;';
    const inp = document.createElement('input'); inp.id = 'r6-prompt'; inp.value = initial || ''; inp.maxLength = o.max || 14; inp.autocomplete = 'off';
    if (o.numeric) { inp.inputMode = 'numeric'; inp.pattern = '[0-9]*'; }
    inp.style.cssText = 'font:800 28px "Barlow Semi Condensed",Arial,sans-serif;padding:10px 12px;border-radius:6px;border:1px solid #444;background:#050608;color:#fff;';
    const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:10px;justify-content:flex-end;';
    const mk = (txt, bg) => { const b = document.createElement('button'); b.type = txt === 'OK' ? 'submit' : 'button'; b.textContent = txt; b.style.cssText = 'font:800 18px "Barlow Semi Condensed",Arial,sans-serif;padding:10px 18px;border-radius:6px;border:none;cursor:pointer;color:#fff;background:' + bg; return b; };
    const cancel = mk('CANCELAR', '#333'), ok = mk('OK', '#e8336d');
    row.append(cancel, ok); box.append(lab, inp, row); wrap.append(box); document.body.append(wrap);
    const stop = e => e.stopPropagation();
    ['keydown', 'keyup', 'touchstart', 'touchend', 'mousedown'].forEach(ev => wrap.addEventListener(ev, stop));
    const close = v => { wrap.remove(); R6.Input.clearAll(); const c = document.getElementById('game'); if (c) c.focus(); cb(v); };
    box.addEventListener('submit', e => { e.preventDefault(); close(inp.value); });
    cancel.addEventListener('click', () => close(null));
    setTimeout(() => { inp.focus(); inp.select(); }, 30);
  };

  R6.Touch = T;
})();

/* ROUND 6 — character.js : procedural articulated 2D characters (side / front / back views), poses, expressions, outfits */
'use strict';
(function () {
  const U = R6.U;
  const TAU = U.TAU;

      son: { num: 7, name: 'Yong-sik', arch: 'coward', look: { fem: false, age: 0, hs: 'short', hair: '#1d1612', skin: '#e2b894', build: 0.95, h: 1.0 }, t: { courage: 0.2, intel: 0.45, str: 0.5, spd: 0.6, trust: 0.4, fear: 0.85, loyalty: 0.5, betray: 0.4, chaos: 0.3, kindness: 0.5, greed: 0.6 }, bio: 'Viciado em apostas. Mente para a mãe sobre tudo.' },
    },
  };
  const KEY_ROLE_PT = { oldman: 'o velho gentil', schemer: 'o estrategista', thief: 'a desertora', worker: 'o trabalhador', gangster: 'o gângster', wild: 'a imprevisível', glass: 'o vidraceiro', girl: 'a solitária', fm001: 'o homem calmo', buddy: 'seu velho amigo', soldier: 'a ex-militar', mother: 'a grávida', crypto: 'o streamer', marine: 'o ex-fuzileiro', rapper: 'o rapper', elder: 'o velho do X', mom: 'a mãe', son: 'o filho' };

  function genName(r, fem) {
    if (r.chance(0.03)) return r.pick(FOREIGN);
    const s = r.pick(SUR); let a = r.pick(SYL), b = r.pick(SYL);

  function makeTraits(r, arch) {
    const base = { courage: 0.5, intel: 0.5, str: 0.5, spd: 0.5, trust: 0.5, fear: 0.45, loyalty: 0.5, betray: 0.35, chaos: 0.3, kindness: 0.5, greed: 0.55, precision: 0.5 };

  }

  function skillsOf(t) {
    return {
      physical: U.clamp((t.str * 0.55 + t.spd * 0.45), 0, 1),
      precision: U.clamp(t.precision * 0.5 + (1 - t.fear) * 0.3 + t.intel * 0.2, 0, 1),
      strategy: U.clamp(t.intel * 0.8 + (1 - t.chaos) * 0.2, 0, 1),
      nerve: U.clamp(t.courage * 0.6 + (1 - t.fear) * 0.4, 0, 1),
      social: U.clamp(t.kindness * 0.4 + t.trust * 0.3 + t.loyalty * 0.3, 0, 1),

  // Build the 456 participants of a season. playerNum reserves that number for the player.
  function build(seed, season, playerNum, playerLook) {
    const r = new U.RNG(seed * 7 + season * 1013);
    const keys = KEYS[season] || {};
    const reserved = new Map();
    for (const k in keys) reserved.set(keys[k].num, k);
    const list = [];
    // resolve conflict: if player took a key number, move key char to a free number
    if (reserved.has(playerNum)) {
      const k = reserved.get(playerNum); reserved.delete(playerNum);
      let n = 456; while (reserved.has(n) || n === playerNum) n--;
      reserved.set(n, k);
    }
    for (let num = 1; num <= 456; num++) {
      if (num === playerNum) {
        list.push({ id: num - 1, num, name: 'VOCÊ', isPlayer: true, look: playerLook, alive: true, rel: 100, mem: [], arch: 'player', tr: makeTraits(r, 'common'), sk: skillsOf(makeTraits(r, 'common')), friends: [], rivals: [], group: -1, key: null });
        continue;
      }
      const keyId = reserved.get(num);
      let p;
      if (keyId) {
        const K = keys[keyId];
        const look = R6.Char.makeLook(Object.assign({ num, seed: num * 13 + season }, K.look), r);
        const tr = Object.assign(makeTraits(r, K.arch), K.t);
        p = { id: num - 1, num, name: K.name, look, arch: K.arch, tr, sk: skillsOf(tr), key: keyId, bio: K.bio, secret: !!K.secret, pregnant: !!K.pregnant, rel: K.startRel || 0 };
      } else {
        const arch = U.weighted(Object.keys(ARCH), a => ARCH[a].w, () => r.next());
        let look;
        if (arch === 'elder') look = R6.Char.makeLook({ age: 2, num, seed: num * 13 + season }, r);
        else look = R6.Char.makeLook({ num, seed: num * 13 + season, age: r.chance(0.25) ? 0 : 1 }, r);
        if (arch === 'bully') look.build = Math.max(look.build, 1.1);
        const tr = makeTraits(r, arch);
        if (look.age === 2) { tr.spd *= 0.6; tr.str *= 0.7; }
        const name = genName(r, look.fem);
        p = { id: num - 1, num, name, look, arch, tr, sk: skillsOf(tr), key: null, bio: `Entrou por causa de ${r.pick(DEBTS)}.`, rel: 0 };
      }
      p.alive = true; p.mem = []; p.friends = []; p.rivals = []; p.group = -1; p.fear = p.tr.fear; p.debt = Math.floor(r.range(0.2, 8) * 1e8);
      p.voteLean = U.clamp(0.5 + (p.tr.greed - 0.5) * 0.6 + (p.tr.courage - 0.5) * 0.4 - (p.tr.fear - 0.5) * 0.6 + r.gauss(0, 0.15), 0, 1); // chance of voting O (continue)
      list.push(p);
    }
    // bot-bot social graph: small friend groups & rivalries
    const idx = list.filter(p => !p.isPlayer).map(p => p.id);
    r.shuffle(idx);
    let g = 0;
    for (let i = 0; i < idx.length;) {
      const size = r.int(2, 5);
      const grp = idx.slice(i, i + size);
      grp.forEach(a => { list[a].group = g; grp.forEach(b => { if (a !== b) list[a].friends.push(b); }); });
      g++; i += size;
    }
    for (let i = 0; i < 180; i++) {
      const a = r.pick(idx), b = r.pick(idx);
      if (a !== b && !list[a].friends.includes(b)) { list[a].rivals.push(b); list[b].rivals.push(a); }
    }
    // story ties
    const byKey = {}; list.forEach(p => { if (p.key) byKey[p.key] = p; });
    const tie = (a, b) => { if (byKey[a] && byKey[b]) { byKey[a].friends.push(byKey[b].id); byKey[b].friends.push(byKey[a].id); } };
    const feud = (a, b) => { if (byKey[a] && byKey[b]) { byKey[a].rivals.push(byKey[b].id); byKey[b].rivals.push(byKey[a].id); } };
    if (season === 1) { tie('thief', 'girl'); feud('gangster', 'thief'); feud('gangster', 'worker'); tie('schemer', 'worker'); tie('wild', 'gangster'); }
    if (season === 2) { tie('mom', 'son'); tie('soldier', 'mother'); feud('crypto', 'mother'); feud('rapper', 'crypto'); feud('elder', 'buddy'); tie('fm001', 'buddy'); }
    return list;
  }

  R6.Roster = { build, KEYS, ARCH, ARCH_PT, KEY_ROLE_PT, skillsOf, genName };
})();

/* ROUND 6 — state.js : campaign state — prize pool, alive count, relationships, memories, flags, decisions, inventory, checkpoints */
'use strict';
(function () {
  const U = R6.U;
  const PER_HEAD = 100000000; // ₩100,000,000 per eliminated participant

  const MEM_PT = {
    helped: 'você o ajudou', saved: 'você salvou a vida dele(a)', shared: 'você dividiu comida', stole: 'você roubou dele(a)', betrayed: 'você o traiu',
    insulted: 'você o provocou', allied: 'fizeram uma aliança', protected: 'você o protegeu', abandoned: 'você o abandonou', fought: 'vocês brigaram',
    spared: 'você poupou a vida dele(a)', comforted: 'você o consolou', lied: 'você mentiu para ele(a)', pushed: 'você o empurrou', teamed: 'jogaram no mesmo time',
    witness_steal: 'viu você roubar', witness_help: 'viu você ajudar alguém', witness_betray: 'viu você trair alguém', witness_fight: 'viu você brigar', gift: 'você deu um presente',
    voted_same: 'votou igual a você', voted_diff: 'votou diferente de você', persuaded: 'você o convenceu', cheated: 'você o enganou',
  };

  const S = {
    s: null,
    get on() { return !!S.s; },

    newGame(profile) {
      const seed = profile.seed || (Date.now() % 1000000);
      S.s = {
        v: 1, seed, season: 1, chapter: 0, diff: R6.Save.diff(),
        player: { name: profile.name || 'Jogador', num: profile.num || 456, look: profile.look, hp: 100, inv: {}, money: 0, karma: 0, gamesWon: 0 },
        prize: 0, flags: {}, decisions: [], log: [], day: 1,
        stats: { eliminated: 0, gamesPlayed: 0, deaths: 0, saved: 0, betrayals: 0, helped: 0 },
        rosterSeason: 1, rosterState: null, keyFates: {},
      };
      S.buildRoster(1);
      return S.s;
    },
    buildRoster(season) {
      const s = S.s;
      s.rosterSeason = season;
      S.roster = R6.Roster.build(s.seed, season, s.player.num, s.player.look);
      S.player = S.roster[s.player.num - 1];
      s.prize = 0;
      S.recount();
    },
    recount() { S.alive = S.roster.filter(p => p.alive).length; },
    get perHead() { return PER_HEAD; },

    // ---------- serialization ----------
    serialize() {
      const s = S.s; if (!s) return null;
      const rs = S.roster.map(p => [p.alive ? 1 : 0, Math.round(p.rel), p.mem.slice(-6), p.group, p.flags || 0, Math.round((p.fear || 0) * 100)]);
      return JSON.parse(JSON.stringify(Object.assign({}, s, { rosterState: rs })));
    },
    restore(data) {
      S.s = JSON.parse(JSON.stringify(data));
      S.roster = R6.Roster.build(S.s.seed, S.s.rosterSeason, S.s.player.num, S.s.player.look);
      if (S.s.rosterState) S.s.rosterState.forEach((a, i) => { const p = S.roster[i]; if (!p) return; p.alive = !!a[0]; p.rel = a[1]; p.mem = a[2] || []; p.group = a[3]; p.flags = a[4]; p.fear = (a[5] || 0) / 100; });
      S.s.rosterState = null;
      S.player = S.roster[S.s.player.num - 1];
      S.recount();
    },
    checkpoint(label) {
      const data = { state: S.serialize(), label: label || '', chapter: S.s.chapter, season: S.s.season };
      S.lastCheckpoint = JSON.parse(JSON.stringify(data));
      R6.Save.writeCampaign(data);
      return data;
    },
    reloadCheckpoint() {
      const d = S.lastCheckpoint || R6.Save.readCampaign();
      if (!d) return false;
      S.restore(d.state);
      return true;
    },

    // ---------- queries ----------
    byKey(k) { return S.roster && S.roster.find(p => p.key === k); },
    byNum(n) { return S.roster && S.roster[n - 1]; },
    aliveBots() { return S.roster.filter(p => p.alive && !p.isPlayer); },
    label(p) { return `#${U.pad(p.num)} ${p.name}`; },
    short(p) { return p.isPlayer ? 'Você' : p.key ? p.name.split(' ').slice(-1)[0] : '#' + U.pad(p.num); },
    tag(p) {
      const r = p.rel;
      if (r >= 55) return { t: 'ALIADO', c: '#2ec4b6' };
      if (r >= 20) return { t: 'AMIGO', c: '#8bd17c' };
      if (r <= -55) return { t: 'INIMIGO', c: '#ff3b5c' };
      if (r <= -20) return { t: 'RIVAL', c: '#f2994a' };
      return { t: 'NEUTRO', c: '#9aa3ad' };
    },
    allies(min = 45) { return S.aliveBots().filter(p => p.rel >= min).sort((a, b) => b.rel - a.rel); },
    enemies(max = -40) { return S.aliveBots().filter(p => p.rel <= max).sort((a, b) => a.rel - b.rel); },
    keyAlive(k) { const p = S.byKey(k); return !!(p && p.alive); },

    // ---------- relationships & memory ----------
    addRel(p, delta, mem, o = {}) {
      if (!p || p.isPlayer) return;
      const before = p.rel;
      // loyalty dampens negative swings for friends; low trust dampens positive ones
      if (delta > 0) delta *= 0.6 + p.tr.trust * 0.8; else delta *= 1.2 - p.tr.loyalty * 0.4;
      p.rel = U.clamp(p.rel + delta, -100, 100);
      if (mem) { p.mem.push(mem); if (p.mem.length > 8) p.mem.shift(); }
      if (!o.silent && (p.key || Math.abs(delta) >= 8)) {
        const up = p.rel > before;
        R6.Toast.show(`${S.short(p) === '#' + U.pad(p.num) ? '#' + U.pad(p.num) : p.name} ${up ? 'confia mais' : 'confia menos'} em você`, { color: up ? '#2ec4b6' : '#ff5a6a', icon: up ? 'circle' : 'x' });
      }
      return p.rel;
    },
    remember(p, mem) { if (!p) return; p.mem.push(mem); if (p.mem.length > 8) p.mem.shift(); },
    memText(code) { return MEM_PT[code] || code; },
    lastMem(p) { return p.mem.length ? MEM_PT[p.mem[p.mem.length - 1]] || p.mem[p.mem.length - 1] : null; },
    // other bots near an act witness it
    witness(list, code, delta) {
      for (const p of list) { if (!p || p.isPlayer || !p.alive) continue; S.addRel(p, delta * (0.5 + p.tr.kindness * 0.6), code, { silent: !p.key }); }
    },

    // ---------- elimination / prize ----------
    eliminate(p, cause) {
      if (!p || !p.alive) return false;
      p.alive = false; p.cause = cause || '';
      if (!p.isPlayer) { S.s.prize += PER_HEAD; S.s.stats.eliminated++; if (p.key) S.s.keyFates[p.key] = cause || 'eliminated'; }
      S.alive--;
      R6.Save.meta.stats.eliminatedSeen++;
      return true;
    },
    revive(p) { if (p && !p.alive) { p.alive = true; S.alive++; if (!p.isPlayer) S.s.prize -= PER_HEAD; } },

    // ---------- flags / decisions / log ----------
    flag(k, v) { if (v === undefined) return S.s ? S.s.flags[k] : undefined; S.s.flags[k] = v; return v; },
    inc(k, n = 1) { S.s.flags[k] = (S.s.flags[k] || 0) + n; return S.s.flags[k]; },
    decide(id, choice, text) { S.s.decisions.push({ id, choice, text: text || '', season: S.s.season }); S.s.flags['d_' + id] = choice; },
    log(text) { S.s.log.push({ d: S.s.day, s: S.s.season, text }); if (S.s.log.length > 80) S.s.log.shift(); },
    karma(n) { S.s.player.karma += n; },

    // ---------- inventory ----------
    give(item, n = 1) { const inv = S.s.player.inv; inv[item] = (inv[item] || 0) + n; const I = ITEMS[item]; if (I) R6.Toast.show(`+ ${I.name}`, { color: '#f2c14e', icon: 'square' }); },
    has(item) { return (S.s.player.inv[item] || 0) > 0; },
    take(item, n = 1) { const inv = S.s.player.inv; if (!inv[item]) return false; inv[item] -= n; if (inv[item] <= 0) delete inv[item]; return true; },

    // ---------- difficulty helper ----------
    D(n, h, x) { return R6.Save.D(n, h, x); },
  };

  const ITEMS = {
    bread: { name: 'Pão', desc: 'Pode ser dividido para ganhar confiança.' },
    egg: { name: 'Ovo cozido', desc: 'Refeição do dormitório.' },
    soda: { name: 'Refrigerante', desc: 'Refeição do dormitório.' },
    lighter: { name: 'Isqueiro', desc: 'Aquecer a agulha facilita a dalgona.' },
    needle: { name: 'Agulha extra', desc: 'Uma agulha mais fina para a dalgona.' },
    hint_dalgona: { name: 'Pista: formas', desc: 'Alguém viu doces de açúcar sendo preparados.' },
    hint_tug: { name: 'Tática: 3 passos', desc: 'O truque dos três passos à frente no cabo de guerra.' },
    hint_glass: { name: 'Pista do vidraceiro', desc: 'Vidro temperado reflete diferente sob luz forte.' },
    marble: { name: 'Bolinha da sorte', desc: 'Presente de alguém que confiava em você.' },
    letter: { name: 'Carta do #218', desc: '"Cuide da minha mãe."' },
    keycard: { name: 'Cartão de acesso', desc: 'Abre portas de serviço e o elevador.' },
    master_key: { name: 'Chave-mestra', desc: 'Presente de uma guarda. Abre a porta de serviço do labirinto.' },
    crowbar: { name: 'Pé de cabra', desc: 'Abre tampas de bueiro e grades.' },
    flashlight: { name: 'Lanterna', desc: 'Ilumina lugares escuros.' },
    photo: { name: 'Foto antiga', desc: 'Uma foto do velho #001 com homens de máscara dourada.' },
    map: { name: 'Planta da ilha', desc: 'Mostra túneis e uma área sem nome.' },
  };

  R6.State = S;
  R6.ITEMS = ITEMS;
})();

/* ROUND 6 — tilemap.js : 3/4 top-down tile maps — collision, line of sight, A* pathfinding, y-sorted wall rendering */
'use strict';
(function () {
  const U = R6.U;
  const T = { FLOOR: 0, WALL: 1, VOID: 2, DOOR: 3, LOW: 4, OPEN: 5 };

  // wall palettes (top, face, faceDark, line)
  const WSTYLE = [
    { top: '#c9c4b8', face: '#8f8b82', faceD: '#6f6b64', line: '#a8a399' },       // 0 concrete
    { top: '#e889a4', face: '#c45f7c', faceD: '#9e4862', line: '#d9728f' },       // 1 pastel pink
    { top: '#7fbcd6', face: '#4f8fad', faceD: '#3d7390', line: '#68a8c4' },       // 2 pastel blue
    { top: '#ecc85e', face: '#c4a03e', faceD: '#9e8030', line: '#dbb44e' },       // 3 pastel yellow
    { top: '#8fc486', face: '#5f9a56', faceD: '#4a7d43', line: '#78b06f' },       // 4 pastel green
    { top: '#3a3d45', face: '#23252b', faceD: '#18191d', line: '#2e3037' },       // 5 industrial dark
    { top: '#e8e6e0', face: '#b9b6ae', faceD: '#9b988f', line: '#d0cdc5' },       // 6 white tile (dorm)
    { top: '#6f5e4c', face: '#4e4135', faceD: '#3a3028', line: '#5e5042' },       // 7 wood/brown
    { top: '#2c3b52', face: '#1c2638', faceD: '#141b28', line: '#26344a' },       // 8 night blue
  ];

  class TileMap {
    constructor(w, h, ts = 32) {
      this.w = w; this.h = h; this.ts = ts; this.wallH = 26;
      this.g = new Uint8Array(w * h);
      this.ws = new Uint8Array(w * h);      // wall style
      this.fs = new Uint8Array(w * h);      // floor style
      this.doors = new Map();                // idx -> door
      this.floorCv = null;
      this.floorPainter = null;
      this.pw = w * ts; this.ph = h * ts;
    }
    idx(tx, ty) { return ty * this.w + tx; }
    inb(tx, ty) { return tx >= 0 && ty >= 0 && tx < this.w && ty < this.h; }
    get(tx, ty) { return this.inb(tx, ty) ? this.g[ty * this.w + tx] : T.WALL; }
    set(tx, ty, v, style) { if (!this.inb(tx, ty)) return; const i = ty * this.w + tx; this.g[i] = v; if (style != null) { if (v === T.WALL) this.ws[i] = style; else this.fs[i] = style; } }
    fill(x0, y0, x1, y1, v, style) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) this.set(x, y, v, style); }
    rect(x0, y0, x1, y1, v, style) { for (let x = x0; x <= x1; x++) { this.set(x, y0, v, style); this.set(x, y1, v, style); } for (let y = y0; y <= y1; y++) { this.set(x0, y, v, style); this.set(x1, y, v, style); } }
    addDoor(tx, ty, o = {}) {
      const d = Object.assign({ tx, ty, open: false, locked: false, key: null, t: 0, horiz: true, id: this.doors.size }, o);
      this.set(tx, ty, d.open ? T.OPEN : T.DOOR); this.doors.set(this.idx(tx, ty), d); return d;
    }
    setDoor(d, open) { if (d.open === open) return; d.open = open; this.g[this.idx(d.tx, d.ty)] = open ? T.OPEN : T.DOOR; d.t = 0; }
    doorAt(tx, ty) { return this.doors.get(this.idx(tx, ty)); }
    solidT(tx, ty) { const v = this.get(tx, ty); return v === T.WALL || v === T.DOOR || v === T.LOW || v === T.VOID; }
    opaqueT(tx, ty) { const v = this.get(tx, ty); return v === T.WALL || v === T.DOOR; }
    solidAt(x, y) { return this.solidT(Math.floor(x / this.ts), Math.floor(y / this.ts)); }
    walkT(tx, ty) { return !this.solidT(tx, ty); }
    center(tx, ty) { return { x: (tx + 0.5) * this.ts, y: (ty + 0.5) * this.ts }; }
    tileOf(x, y) { return { tx: Math.floor(x / this.ts), ty: Math.floor(y / this.ts) }; }

    // circle vs solid tiles: returns corrected position
    collide(x, y, r) {
      const ts = this.ts;
      const tx0 = Math.floor((x - r) / ts), tx1 = Math.floor((x + r) / ts), ty0 = Math.floor((y - r) / ts), ty1 = Math.floor((y + r) / ts);
      for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
        if (!this.solidT(tx, ty)) continue;
        const rx = tx * ts, ry = ty * ts;
        const cx = U.clamp(x, rx, rx + ts), cy = U.clamp(y, ry, ry + ts);
        let dx = x - cx, dy = y - cy; const d2 = dx * dx + dy * dy;
        if (d2 < r * r) {
          if (d2 > 0.0001) { const d = Math.sqrt(d2); x += dx / d * (r - d); y += dy / d * (r - d); }
          else { // center inside tile: push out along smallest axis
            const l = x - rx, rr = rx + ts - x, t = y - ry, b = ry + ts - y; const m = Math.min(l, rr, t, b);
            if (m === l) x = rx - r; else if (m === rr) x = rx + ts + r; else if (m === t) y = ry - r; else y = ry + ts + r;
          }
        }
      }
      return { x, y };
    }

/* ROUND 6 — stealth.js : procedural pastel/industrial mazes, guard vision cones + detection meters, patrol/search/chase AI,

    const links = [];

    while (stack.length) {
      const [cx, cy] = stack[stack.length - 1];

        R6.UI.bar(ctx, x - 90, y, 240, 12, this.phase === 'power' ? this.power : this.powerLock, { color: '#e8336d', zone: [0.8 - this.widthP * 0.8, 0.8 + this.widthP * 0.8] });
        R6.UI.text(ctx, 'ÂNGULO', x - 155, y + 44, { size: 14, weight: 800, color: this.phase === 'angle' ? '#fff' : '#666' });
        R6.UI.bar(ctx, x - 90, y + 36, 240, 12, this.phase === 'angle' ? this.angle : 0, { color: '#2ec4b6', zone: [this.optA - this.widthA * 0.7, this.optA + this.widthA * 0.7] });
      }
    }
  }
  R6.DdakjiCore = DdakjiCore;

  // ---------------- full scene ----------------
  const OPP = [
    { name: 'Cobrador Kim', skill: 0.35 }, { name: 'Sra. Lee', skill: 0.42 }, { name: 'Estudante Park', skill: 0.5 }, { name: 'Taxista Choi', skill: 0.56 },
    { name: 'Monge Han', skill: 0.62 }, { name: 'Campeão de rua', skill: 0.7 }, { name: 'Mestre Oh', skill: 0.78 }, { name: 'O Recrutador', skill: 0.85 },
  ];

  class DdakjiScene extends R6.GameBase {
    constructor(opts = {}) {
      super(opts);
      this.gameId = 'ddakji'; this.name = 'ddakji';
      this.variant = opts.variant || (this.mode === 'campaign' ? 'recruiter' : 'practice');
      this.title = this.variant === 'championship' ? 'DDAKJI CHAMPIONSHIP' : 'DDAKJI';
      this.pl = opts.playerLook || (R6.State.s ? R6.State.s.player.look : R6.Char.makeLook({ num: 456 }));
      this.plCiv = Object.assign({}, this.pl, { outfit: this.variant === 'recruiter' ? 'civil' : this.pl.outfit, civ: { top: '#6b5a44', bottom: '#3a3f4a' } });
      this.round = 0; this.wins = 0; this.losses = 0; this.slaps = 0; this.moneyWon = 0;
      this.bracket = 0; this.setupOpponent();
      this.turn = 'player'; this.msg = null; this.msgT = 0; this.placement = 1;
      this.core = new DdakjiCore({ x: 640, y: 540, size: 70, fx: this.fx, colA: '#c83434', colB: '#2458c9', onResult: (flip, q) => this.onPlayerResult(flip, q), thrower: () => this.plAnim('throw') });
      this.core.throwFrom = { x: 360, y: 400 };
      this.plA = 'kneel'; this.plT = 0; this.opA = 'kneel'; this.opT = 0;
      this.walkers = []; for (let i = 0; i < 7; i++) this.walkers.push({ look: R6.Char.makeLook({ outfit: 'civil' }), x: U.rand(0, 1280), v: U.rand(40, 80) * (Math.random() < 0.5 ? 1 : -1) });
      this.state2 = 'player';
      this.after = null; this.chips = 0;
    }
    setupOpponent() {
      if (this.variant === 'recruiter') { this.opp = { name: 'Recrutador', skill: R6.Save.D(0.3, 0.45, 0.6), look: R6.Char.makeLook({ outfit: 'suit', hs: 'slick', hair: '#1a1411', skin: '#e9c3a0', build: 1.0, h: 1.04, seed: 77, glasses: false, beard: null }) }; }
      else if (this.variant === 'championship') { const o = OPP[this.bracket]; this.opp = { name: o.name, skill: o.skill * R6.Save.D(1, 1.1, 1.2), look: R6.Char.makeLook({ outfit: this.bracket === 7 ? 'suit' : 'civil', seed: 500 + this.bracket }) }; this.needWins = 2; this.rw = 0; this.rl = 0; }
      else this.opp = { name: 'Adversário', skill: 0.45 * R6.Save.D(1, 1.2, 1.4), look: R6.Char.makeLook({ outfit: 'civil', seed: 999 }) };
    }
    rules() {
      const base = {
        title: this.title, icon: 'square', sub: this.variant === 'recruiter' ? 'O HOMEM DE TERNO NA ESTAÇÃO' : this.variant === 'championship' ? '8 ADVERSÁRIOS · MELHOR DE 3' : 'TREINO',
        lines: ['Vire o ddakji do adversário com o seu para vencer a rodada.', 'Mire no canto levantado (sombra sob a borda) — é onde o ar entra.', 'Solte a força na faixa clara e acerte o ângulo no momento certo.', 'Na vez dele, escolha onde apoiar o seu ddakji.'],
        keys: [['MOUSE', 'mirar'], ['CLIQUE/ESPAÇO', 'força e ângulo']],
      };
      if (this.variant === 'recruiter') base.lines.push('Se perder: um tapa… ou ₩100.000. Se vencer: ₩100.000 para você.');
      return base;
    }
    begin() { R6.Music.play('tension'); R6.Music.setIntensity(0.1); this.say(this.variant === 'recruiter' ? 'Sua vez. Vire o meu.' : 'Sua vez!'); }
    say(t) { this.msg = t; this.msgT = 0; }
    plAnim(a) { this.plA = a; this.plT = 0; }
    opAnim(a) { this.opA = a; this.opT = 0; }
    enter() { R6.Audio.loop('hum', 0.5); R6.Audio.loop('crowd', 0.25); }
    focus() { return { x: 300, y: 640, look: this.pl, scale: 2.2, facing: 1 }; }
    onPlayerResult(flip, q) {
      if (this.turn === 'player') {
        if (flip) { this.say(q && q.perfect ? 'PERFEITO! VIROU!' : 'VIROU!'); R6.Audio.sfx('win'); this.fx.emit('star', 640, 520, 16); this.roundWon(); }
        else { this.say(U.pick(['Quase…', 'Não virou.', 'Nem se mexeu.', 'Faltou força… ou sobrou.'])); this.after = { t: 1.2, fn: () => this.startOppTurn() }; }
      } else {
        if (flip) { this.say(this.variant === 'recruiter' ? 'Virou. Você perdeu.' : 'Ele virou o seu!'); R6.Audio.sfx('error'); this.roundLost(); }
        else { this.say(U.pick(['Ele errou!', 'O seu resistiu!', 'Não virou!'])); this.after = { t: 1.2, fn: () => this.startPlayerTurn() }; }
      }
    }
    startPlayerTurn() {
      this.turn = 'player'; this.core.colA = '#c83434'; this.core.colB = '#2458c9'; this.core.newTarget(); this.core.throwFrom = { x: 360, y: 400 };
      this.core.onResult = (f, q) => this.onPlayerResult(f, q); this.say('Sua vez.');
    }
    startOppTurn() {
      this.turn = 'place'; this.core.colA = '#2458c9'; this.core.colB = '#c83434'; this.core.newTarget(); this.core.phase = 'wait';
      this.placeMenu = new R6.UI.Menu([
        { label: 'No centro do piso liso', sub: 'seguro', action: () => this.place(0) },
        { label: 'Perto da parede', sub: 'médio', action: () => this.place(1) },
        { label: 'Sobre a junta do piso', sub: 'arriscado · distrai', action: () => this.place(2) },
      ]);
      this.say('Onde você apoia o seu ddakji?');
    }
    place(i) {
      this.turn = 'opp'; this.placement = i; this.placeMenu = null;
      const mult = [0.62, 1.0, 1.35][i];
      this.core.lift = [0.45, 0.75, 1][i];
      let p = U.clamp(0.1 + this.opp.skill * 0.38, 0.05, 0.9) * mult;
      if (i === 2 && Math.random() < 0.25) { p *= 0.4; } // the seam can also make him misjudge
      this.oppP = p; this.oppTimer = 1.3; this.opAnim('windup');

    roundWon() {
      this.wins++; this.round++;
      if (this.variant === 'recruiter') {
        this.moneyWon += 100000; if (R6.State.s) R6.State.s.player.money += 100000;
        this.after = { t: 1.6, fn: () => this.recruiterAfterWin() };
      } else if (this.variant === 'championship') {
        this.rw++;
        if (this.rw >= this.needWins) { this.after = { t: 1.4, fn: () => this.nextBracket() }; }
        else this.after = { t: 1.4, fn: () => this.startPlayerTurn() };
      } else { this.after = { t: 1.4, fn: () => { this.chips = 40; this.win({ sub: 'VOCÊ VIROU O DDAKJI' }); } }; }
    }
    roundLost() {
      this.losses++; this.round++;
      if (this.variant === 'recruiter') { this.after = { t: 1.0, fn: () => this.recruiterPunish() }; }
      else if (this.variant === 'championship') { this.rl++; if (this.rl >= this.needWins) this.after = { t: 1.2, fn: () => { this.score = this.bracket; this.scoreId = 'ddakji_champ'; this.scoreLabel = 'ADVERSÁRIOS VENCIDOS'; this.lose({ reason: 'Eliminado por ' + this.opp.name }); } }; else this.after = { t: 1.2, fn: () => this.startPlayerTurn() }; }
      else this.after = { t: 1.2, fn: () => this.lose({ reason: 'O seu ddakji foi virado' }) };
    }
    nextBracket() {
      this.bracket++;
      if (this.bracket >= OPP.length) { this.score = 8; this.scoreId = 'ddakji_champ'; this.scoreLabel = 'ADVERSÁRIOS VENCIDOS'; this.chips = 400; this.win({ title: 'CAMPEÃO', sub: 'DDAKJI CHAMPIONSHIP' }); return; }
      this.setupOpponent(); R6.Banner.show('ADVERSÁRIO ' + (this.bracket + 1) + '/8', this.opp.name, { dur: 2 }); this.startPlayerTurn();
    }
    recruiterPunish() {
      const hasMoney = R6.State.s && R6.State.s.player.money >= 100000;
      R6.Dialog.show({
        who: { name: 'RECRUTADOR', look: this.opp.look }, text: 'Você perdeu. Pagar ₩100.000… ou levar um tapa?',
        choices: [
          { t: 'Levar o tapa', cb: () => this.slap() },
          { t: 'Pagar ₩100.000', disabled: !hasMoney, sub: hasMoney ? '' : 'sem dinheiro', cb: () => { R6.State.s.player.money -= 100000; this.moneyWon -= 100000; R6.Audio.sfx('coin'); this.startPlayerTurn(); } },
        ],
      });
    }
    slap() {
      this.slaps++; R6.Audio.sfx('slap'); R6.Engine.flash('#ff2244', 0.25); R6.Engine.shake(18, 0.35); this.opAnim('punch'); this.plAnim('stagger');
      this.say(['Um.', 'Dois.', 'Três.', 'Quatro.', 'Cinco…'][Math.min(4, this.slaps - 1)]);
      if (R6.State.s) R6.State.s.player.hp = Math.max(40, R6.State.s.player.hp - 4);
      this.after = { t: 1.4, fn: () => this.startPlayerTurn() };
    }
    recruiterAfterWin() {
      R6.Audio.sfx('coin');
      const plays = this.wins;
      R6.Dialog.show({
        who: { name: 'RECRUTADOR', look: this.opp.look }, expr: 'smirk',
        text: plays === 1 ? 'Parabéns. ₩100.000 são seus. Quer jogar de novo… ou prefere um jogo onde se ganha muito mais?' : `Você já tem ${U.money(this.moneyWon)}. Mais uma partida?`,
        choices: [
          { t: 'Jogar outra partida', cb: () => { this.startPlayerTurn(); } },
          { t: 'Aceitar o cartão do jogo maior', cb: () => { R6.State.s && R6.State.flag('ddakji_wins', this.wins); R6.State.s && R6.State.flag('ddakji_slaps', this.slaps); this.win({ title: 'CARTÃO ACEITO', sub: `${this.wins} VITÓRIA(S) · ${this.slaps} TAPA(S)`, wait: 2.6 }); } },
        ],
      });
    }
    update(dt) {
      this.t += dt; this.plT += dt; this.opT += dt; this.msgT += dt;
      for (const w of this.walkers) { w.x += w.v * dt; if (w.x < -80) w.x = 1360; if (w.x > 1360) w.x = -80; }
      this.fx.update(dt);
      if (this.updateResult(dt)) { this.core.update(dt, false); return; }
      if (this.updateRules(dt)) return;
      if (R6.Dialog.active) return;
      if (this.after) { this.after.t -= dt; if (this.after.t <= 0) { const f = this.after.fn; this.after = null; f(); } this.core.update(dt, false); return; }
      if (this.turn === 'place' && this.placeMenu) { this.placeMenu.update(dt); return; }
      if (this.turn === 'opp') {
        if (this.core.phase === 'wait') { this.oppTimer -= dt; if (this.oppTimer <= 0) { this.opAnim('throw'); this.core.onResult = (f, q) => this.onPlayerResult(f, q); this.core.aiThrow(this.oppP, { x: 920, y: 400 }); } }
        this.core.update(dt, false); return;
      }
      if (this.plA === 'throw' && this.plT > 0.5) this.plAnim('kneel');
      if (this.opA !== 'kneel' && this.opA !== 'windup' && this.opT > 0.6) this.opAnim('kneel');
      if (this.plA === 'stagger' && this.plT > 0.6) this.plAnim('kneel');
      this.core.update(dt, true);
    }
    render(ctx) {
      // background wall
      const g = ctx.createLinearGradient(0, 0, 0, 330); g.addColorStop(0, '#cfd1ca'); g.addColorStop(1, '#b7b9b2');
      ctx.fillStyle = g; ctx.fillRect(0, 0, R6.W, 330);
      ctx.strokeStyle = 'rgba(0,0,0,.07)'; for (let y = 0; y < 330; y += 18) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(R6.W, y); ctx.stroke(); }
      ctx.fillStyle = '#2e7d5b'; ctx.fillRect(0, 200, R6.W, 22);
      if (this.variant !== 'championship') { ctx.fillStyle = '#12355b'; ctx.fillRect(900, 60, 280, 50); R6.UI.text(ctx, 'ESTAÇÃO GONGDEOK', 915, 95, { size: 24, weight: 800, color: '#fff' }); }
      else { ctx.fillStyle = '#e8336d'; ctx.fillRect(0, 60, R6.W, 60); R6.UI.text(ctx, 'DDAKJI CHAMPIONSHIP · ADVERSÁRIO ' + (this.bracket + 1) + '/8', 640, 100, { size: 30, fam: 'title', align: 'center', color: '#fff', spacing: 4 }); }
      // walkers in the background
      for (const w of this.walkers) R6.Char.draw(ctx, w.look, w.x, 318, { view: 'side', dir: Math.sign(w.v), anim: 'walk', t: this.t + w.x, scale: 0.95, alpha: 0.55, shadow: false });
      // floor in perspective
      const fg = ctx.createLinearGradient(0, 320, 0, R6.H); fg.addColorStop(0, '#8b8d88'); fg.addColorStop(1, '#6a6c67');
      ctx.fillStyle = fg; ctx.fillRect(0, 320, R6.W, R6.H - 320);
      ctx.strokeStyle = 'rgba(0,0,0,.13)'; ctx.lineWidth = 1.5;
      for (let i = -12; i <= 12; i++) { ctx.beginPath(); ctx.moveTo(640 + i * 40, 320); ctx.lineTo(640 + i * 190, R6.H); ctx.stroke(); }
      for (let k = 0; k < 9; k++) { const y = 320 + Math.pow(k / 8, 1.8) * 400; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(R6.W, y); ctx.stroke(); }
      if (this.turn === 'place' || this.turn === 'opp') { // highlight chosen placement area
        const spots = [[640, 560], [640, 500], [640, 540]];
        if (this.turn === 'opp' && this.placement === 2) { ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(560, 520); ctx.lineTo(720, 560); ctx.stroke(); }
      }
      // opponent (right) and player (left), kneeling, big
      R6.Char.draw(ctx, this.opp.look, 1010, 660, { view: 'side', dir: -1, anim: this.opA === 'kneel' ? 'kneel' : this.opA === 'windup' ? 'kneel' : this.opA === 'throw' ? 'kneelThrow' : this.opA, t: this.opA === 'kneel' ? this.t : this.opT, scale: 2.3, expr: this.turn === 'opp' ? 'determined' : 'smirk' });
      this.core.draw(ctx, { projA: this.turn === 'player' ? '#2458c9' : '#c83434', projB: this.turn === 'player' ? '#c83434' : '#2458c9' });
      this.fx.draw(ctx);
      R6.Char.draw(ctx, this.plCiv, 270, 660, { view: 'side', dir: 1, anim: this.plA === 'kneel' ? 'kneel' : this.plA === 'throw' ? 'kneelThrow' : this.plA, t: this.plA === 'kneel' ? this.t : this.plT, scale: 2.3, expr: this.slaps > 0 && this.plA === 'stagger' ? 'pain' : 'determined' });
      R6.UI.vignette(ctx, 0.45);
      // HUD
      if (this.phase === 'play') {
        const phaseTxt = { aim: '1 · MIRA — mova o mouse até o canto levantado e clique', power: '2 · FORÇA — solte na faixa clara', angle: '3 · ÂNGULO — clique quando o ponteiro estiver na faixa' }[this.core.phase];
        if (this.turn === 'player' && phaseTxt && !this.after) R6.UI.text(ctx, phaseTxt, 640, 700, { size: 17, align: 'center', color: '#fff', weight: 700, shadow: true });
        if (this.turn === 'player') this.core.drawMeters(ctx, 640, 600);
        const score = this.variant === 'recruiter' ? `VITÓRIAS ${this.wins}   ·   TAPAS ${this.slaps}   ·   GANHO ${U.money(this.moneyWon)}` : this.variant === 'championship' ? `RODADAS ${this.rw || 0} × ${this.rl || 0}` : `VITÓRIAS ${this.wins} · DERROTAS ${this.losses}`;
        R6.UI.panel(ctx, 640 - 260, 14, 520, 40, { fill: 'rgba(6,8,12,.75)', shadow: false });
        R6.UI.text(ctx, score, 640, 40, { size: 17, align: 'center', weight: 800, color: '#f2c14e', spacing: 1 });
        if (this.msg && this.msgT < 2.4) { const a = Math.min(1, this.msgT * 5, (2.4 - this.msgT) * 2); R6.UI.text(ctx, this.msg, 640, 170, { size: 44, fam: 'title', align: 'center', color: '#fff', alpha: a, shadow: true, spacing: 3 }); }
        if (this.turn === 'place' && this.placeMenu) { R6.UI.panel(ctx, 400, 470, 480, 180, { fill: 'rgba(6,8,12,.9)' }); this.placeMenu.draw(ctx, 420, 486, 440, 44, 8, { size: 17, align: 'left' }); }
      }
      this.drawRules(ctx);
    }
  }

  R6.DdakjiScene = DdakjiScene;
  R6.registerGame('ddakji', { name: 'Ddakji', season: 1, icon: 'square', desc: 'Vire o ddakji do adversário.', create: o => new DdakjiScene(o) });
})();

</script>
<script>/* js/games/redlight.js */
/* ROUND 6 — redlight.js : Red Light, Green Light — huge top-down arena, hundreds of AI players, doll with motion detection,
   panic waves, pushes, occlusion (hide behind others), catching falling players, time limit. Variants: s1, s2, endless */
'use strict';
(function () {
  const U = R6.U, TAU = U.TAU;
  const FW = 1600, FH = 3300, FINISH = 470, START = 3050;

  class RedLight extends R6.GameBase {
    constructor(opts = {}) {
      super(opts);
      this.gameId = opts.variant === 's2' ? 'redlight2' : 'redlight'; this.name = 'redlight';
      this.variant = opts.variant || 's1';
      this.endless = this.variant === 'endless';
      this.world = new R6.World({ bounds: { x: 30, y: 60, w: FW - 60, h: FH - 60 } });
      this.world.sepStrength = 0.9;
      this.cam = new R6.Camera({ bounds: { x: 0, y: -260, w: FW, h: FH + 260 } });
      this.timeLimit = this.endless ? R6.Save.D(75, 65, 55) : R6.Save.D(210, 175, 140);
      this.timeLeft = this.timeLimit;
      this.light = 'green'; this.lightT = 0; this.face = 0; this.greenDur = 4; this.redDur = 3; this.turnDur = R6.Save.D(0.5, 0.38, 0.3); this.grace = R6.Save.D(0.12, 0.06, 0.0);
      this.detectOn = false; this.cycle = 0; this.firstDeath = false; this.panicWave = false;
      this.playerFinished = false; this.over = false; this.overT = 0; this.catchPrompt = null; this.stagger = null; this.warned = false; this.rounds = 0;
      this.shots = []; this.scanAng = 0; this.intro = 0;
      this.build();
    }
    rules() {
      return {
        title: 'BATATINHA FRITA 1, 2, 3', icon: 'circle', sub: this.endless ? 'RED LIGHT ENDLESS · QUANTAS RODADAS VOCÊ AGUENTA?' : 'JOGO 1 · ' + (this.variant === 's2' ? 'TEMPORADA 2' : 'TEMPORADA 1'),
        lines: [
          'Enquanto a boneca canta (GREEN LIGHT), avance até a linha de chegada.',
          'Quando ela virar (RED LIGHT), PARE. Qualquer movimento detectado = eliminado.',
          'Correr é mais rápido, mas você demora mais para frear.',
          'Esconder-se atrás de outro jogador pode enganar os sensores.',
          'Segure quem estiver caindo perto de você com E. Esbarrões: ESPAÇO para se equilibrar.',
        ].concat(this.variant === 's2' ? ['Q no início: avise os outros jogadores sobre as regras.'] : []),
        keys: [['WASD', 'mover'], ['SHIFT', 'correr'], ['E', 'segurar'], ['ESPAÇO', 'equilíbrio']],
      };
    }
    build() {
      const S = R6.State;
      const parts = this.endless ? null : (S.s ? S.roster.filter(p => p.alive) : null);
      const plLook = S.s ? S.s.player.look : R6.Char.makeLook({ num: 456 });
      // player
      this.pl = this.world.add(new R6.Actor({ p: S.s ? S.player : null, look: plLook, x: FW / 2, y: START + 90, isPlayer: true, speed: 78, runSpeed: 138, accel: R6.Save.D(420, 380, 340), id: 'player' }));
      this.pl.dir = 'up';
      // bots
      const list = parts ? parts.filter(p => !p.isPlayer) : Array.from({ length: this.endless ? 70 : 200 }, (_, i) => ({ num: i + 1, name: '', look: R6.Char.makeLook({ num: i + 1 }), tr: { courage: Math.random(), intel: Math.random(), fear: Math.random(), spd: Math.random(), str: Math.random(), kindness: Math.random(), betray: Math.random() * 0.6, chaos: Math.random() * 0.5 }, alive: true, rel: 0, fake: true }));
      const cols = 38; const warnLeft = 0;
      list.forEach((p, i) => {
        const col = i % cols, row = Math.floor(i / cols);
        const x = 110 + col * ((FW - 220) / (cols - 1)) + U.rand(-8, 8), y = START + 40 + row * 26 + U.rand(-6, 6);
        const a = this.world.add(new R6.Actor({ p: p.fake ? null : p, look: p.look, x, y, speed: 55 + p.tr.spd * 35, runSpeed: 110 + p.tr.spd * 50, accel: 620 }));
        a.bot = p; a.dir = 'up';
        const kind = p.key != null;
        a.ai = {
          startDelay: U.rand(0.1, 0.8) + (1 - p.tr.courage) * 1.2, laneX: x, react: 0.02 + (1 - p.tr.intel) * 0.08 + p.tr.fear * 0.05,
          pErr: kind ? 0 : (0.012 + p.tr.fear * 0.03 + (1 - p.tr.intel) * 0.022 + p.tr.chaos * 0.02) * R6.Save.D(1, 1.1, 1.2),
          anticipate: p.tr.intel > 0.7, shielder: p.tr.intel > 0.75 && p.tr.betray > 0.4, pusher: p.tr.betray > 0.8 && p.tr.str > 0.7 && !kind,
          caught: false, willErr: false, errT: 0, panic: false, bold: p.tr.courage > 0.75, key: kind, catcher: (p.tr.kindness > 0.8 || p.key === 'worker') && !this.endless,
          wiggle: U.rand(0, 10), slowpoke: p.tr.courage < 0.2 && !kind,
        };
        a.brain = (b, dt) => this.botBrain(b, dt);
      });
      // guards along both sides
