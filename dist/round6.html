<script>/* js/games/glassbridge.js */
/* ROUND 6 — glassbridge.js : Glass Bridge — vest order choice, 18 steps of tempered vs normal glass, memory (watch others),
   examine reflections / listen to the glass, glass-maker beat & lights off, hesitation, pushing, falls, time limit. Variant: endless */
'use strict';
(function () {
  const U = R6.U, TAU = U.TAU;
  const X0 = 360, STEP = 112, YN = 540, YF = 486;

  class GlassBridge extends R6.GameBase {
    constructor(opts = {}) {
      super(opts);
      this.gameId = 'glassbridge'; this.name = 'glassbridge';
      this.endless = opts.variant === 'endless';
      this.N = this.endless ? 400 : 18;
      this.safe = []; for (let i = 0; i < this.N; i++) this.safe.push(Math.random() < 0.5 ? 'near' : 'far');
      this.revealed = new Array(this.N).fill(null); this.broken = Array.from({ length: this.N }, () => ({ near: false, far: false }));
      this.timeLimit = this.endless ? 9999 : R6.Save.D(260, 215, 180); this.timeLeft = this.timeLimit;
      this.cam = new R6.Camera({ bounds: { x: -200, y: -300, w: X0 + this.N * STEP + 900, h: 1400 } });
      this.cam.set(300, 380, 1.1);
      this.lights = 1; this.lightsOff = false; this.stage = this.campaign ? 'vest' : 'play';
      this.hasHint = R6.State.s && (R6.State.has('hint_glass') || R6.State.flag('hint_glass'));
      this.hasMarble = R6.State.s && R6.State.has('marble');
      this.examine = null; this.pushQTE = null; this.score = 0;
      this.buildQueue();
    }
    rules() {
      if (this.stage === 'vest') return null;
      return {
        title: this.endless ? 'GLASS BRIDGE ENDLESS' : 'PONTE DE VIDRO', icon: 'triangle', sub: this.endless ? 'ATÉ ONDE VOCÊ CHEGA?' : this.N + ' PASSOS · VIDRO TEMPERADO OU VIDRO COMUM',
        lines: [
          'Em cada passo há dois painéis: um aguenta, o outro quebra.',
          'Observe quem vai na frente — os painéis revelados ficam na memória (brilham).',
          'W = pular no painel do FUNDO · S = pular no painel da FRENTE · D = avançar no caminho conhecido.',
          'Segure E para examinar o reflexo (melhor com luz). Q = jogar/ouvir o vidro.',
          this.endless ? 'Cada passo vale pontos. Um erro e acabou.' : 'Quem não atravessar antes do tempo acabar será eliminado.',
        ],
        keys: [['W / S', 'escolher painel'], ['D', 'avançar'], ['E', 'examinar'], ['Q', 'ouvir'], ['ESPAÇO', 'resistir a empurrão']],
      };
    }
    buildQueue() {
      const S = R6.State; const plLook = S.s ? S.s.player.look : R6.Char.makeLook({ num: 456 });
      let bots;
      if (this.campaign && S.s) bots = S.aliveBots();
      else bots = Array.from({ length: this.endless ? 0 : 13 }, (_, i) => ({ num: 10 + i * 23, look: R6.Char.makeLook({ num: 10 + i * 23 }), tr: { fear: Math.random(), betray: Math.random(), courage: Math.random(), intel: Math.random() }, fake: true, alive: true }));
      this.people = bots.map(p => this.mk(p, p.look, false));
      this.me = this.mk(S.s ? S.player : null, plLook, true);
      this.vestPick = 1;
      if (!this.campaign) { const n = this.people.length + 1; this.assignOrder(this.endless ? 1 : Math.min(n, U.randi(Math.ceil(n * 0.5), n))); }
      else {
        const n = this.people.length + 1;
        // bots grab numbers first (some already taken when you arrive)
        this.taken = new Set(); const tk = Math.floor(n * 0.45);
        while (this.taken.size < tk) this.taken.add(U.randi(1, n));
        this.vestMenuI = [...Array(n).keys()].map(i => i + 1).find(v => !this.taken.has(v)) || 1;
      }
    }
    mk(p, look, isPlayer) { return { p, look: Object.assign({}, look, { vest: 'black' }), isPlayer, pos: -1, row: 'near', x: 0, y: YN, t: Math.random() * 3, state: 'wait', hes: 0, fall: null, done: false, dead: false, jump: null, anim: 'idle' }; }
    assignOrder(myNum) {
      const n = this.people.length + 1;
      // story order: important characters towards the back (except those whose beat happens on the bridge)
      const pri = p => { const k = p.p && p.p.key; if (k === 'thief' || k === 'schemer') return 3; if (k === 'glass') return 2.2; if (k === 'gangster' || k === 'wild') return 1.6; return Math.random() * 2; };
      const sorted = this.people.slice().sort((a, b) => pri(a) - pri(b));
      const order = []; let k = 0;
      for (let v = 1; v <= n; v++) { if (v === myNum) order.push(this.me); else order.push(sorted[k++]); }
      this.queue = order;
      this.queue.forEach((a, i) => { a.vestNum = i + 1; a.look.vestNum = i + 1; a.x = 280 - i * 34; a.y = YN; a.row = 'near'; a.q = i; });
      this.myNum = myNum;
      if (this.campaign) R6.State.decide('glass_vest', myNum, 'Colete ' + myNum);
    }
    begin() {
      R6.Music.play('tension'); R6.Music.setIntensity(0.3); R6.Audio.loop('wind', 0.25);
      if (!this.endless) R6.Dialog.announce('Vocês têm ' + U.time(this.timeLimit) + ' para atravessar a ponte. Boa sorte.', null, 3);
      this.stage = 'play';
    }
    focus() { const s = this.cam.toScreen(this.me.x, this.me.y); return { x: s.x, y: s.y, look: this.me.look, scale: 1.15 * this.cam.zoom, facing: 1 }; }
    stepX(i) { return X0 + i * STEP + STEP / 2; }
    rowY(r) { return r === 'far' ? YF : YN; }
    leader() { return (this.queue || []).find(a => !a.done && !a.dead); }
    occupied(i, except) { return this.queue.some(a => a !== except && !a.dead && !a.done && a.pos === i); }
    // ------------------------------------------------ update
    update(dt) {
      this.t += dt; this.fx.update(dt);
      for (const a of (this.queue || [])) this.updPerson(a, dt);
      if (this.stage === 'vest') return this.updVest(dt);
      if (this.updateResult(dt)) { this.cam.update(dt); return; }
      if (this.updateRules(dt)) { this.cam.update(dt); return; }
      if (!this.endless) this.timeLeft -= dt;
      if (this.timeLeft <= 0 && !this.exploded) this.explode();
      if (this.fastEnd && !this.result && !this.exploded) { R6.Engine.timeScale = 3; if (this.queue.every(a => a.done || a.dead)) { R6.Engine.timeScale = 1; this.finishWin(); } }
      if (this.exploded) { this.explT += dt; if (this.explT > 3 && !this.result) { if (this.me.done) this.finishWin(); } this.cam.update(dt); return; }
      const L = this.leader();
      // lights: the Front Man turns them off when the glass-maker starts reading them
      if (this.lightsOffPending) { this.lightsOffPending -= dt; if (this.lightsOffPending <= 0) { this.lightsOff = true; this.lightsOffPending = 0; R6.Audio.sfx('doorSlam'); R6.Toast.show('As luzes foram apagadas.', { color: '#ff5a6a' }); } }
      this.lights = U.approach(this.lights, this.lightsOff ? 0.25 : 1, dt * 2);
      // bots
      for (const a of this.queue) if (!a.isPlayer && !a.dead && !a.done && !a.jump) this.botThink(a, dt, a === L);
      // player
      this.updPlayer(dt, L);
      // camera: follow leader & player
      const fx = L ? (L.isPlayer ? L.x : (L.x + this.me.x) / 2) : this.me.x;
      const tension = L && L.state === 'decide' ? 1 : 0;
      this.cam.follow(U.clamp(fx, this.me.x - 380, this.me.x + 380) + 60, 400 + (this.me.fall ? this.me.fall.y * 0.5 : 0), U.lerp(1.05, 1.3, tension * 0.6));
      this.cam.update(dt);
      R6.Music.setIntensity(0.3 + tension * 0.5 + (this.timeLeft < 40 ? 0.3 : 0));
      if (this.endless) { this.score = Math.max(this.score, this.me.pos + 1); }
    }
    updVest(dt) {
      const I = R6.Input; const n = this.people.length + 1;
      const mv = d => { let v = this.vestMenuI; for (let k = 0; k < n; k++) { v = ((v - 1 + d + n) % n) + 1; if (!this.taken.has(v)) break; } this.vestMenuI = v; R6.Audio.sfx('hover'); };
      const C = this.vestCols(); if (I.actP('right')) mv(1); if (I.actP('left')) mv(-1); if (I.actP('down')) mv(C); if (I.actP('up')) mv(-C);
      const m = I.mouse; if (this.vRects) this.vRects.forEach((r, i) => { if (U.rectHit(m.x, m.y, r) && !this.taken.has(i + 1)) { if (m.moved) this.vestMenuI = i + 1; if (m.pressed) { this.vestMenuI = i + 1; this.pickVest(); } } });
      if (I.actP('confirm')) this.pickVest();
    }
    vestCols() { const n = this.people.length + 1; return n <= 16 ? Math.min(8, n) : Math.max(8, Math.ceil(Math.sqrt(n * 2.6))); }
    pickVest() { R6.Audio.sfx('confirm'); this.assignOrder(this.vestMenuI); this.stage = 'rules'; this.phase = 'rules'; this.rulesT = 0; }
    updPerson(a, dt) {
      a.t += dt;
      if (a.jump) {
        const J = a.jump; J.t += dt; const k = Math.min(1, J.t / J.dur);
        a.x = U.lerp(J.x0, J.x1, k); a.y = U.lerp(J.y0, J.y1, k) - Math.sin(k * Math.PI) * 55; a.anim = 'jump';
        if (k >= 1) { a.jump = null; this.land(a, J); }
      }
      if (a.fall) { const f = a.fall; f.t += dt; f.vy += 1500 * dt; f.y += f.vy * dt; a.y = f.y0 + f.y; a.anim = 'flail'; if (!f.thud && f.y > 700) { f.thud = true; R6.Audio.sfx('thud', { vol: 0.35, delay: 0.3 }); } }
      if (a.walk) { const w = a.walk; const d = w.x - a.x; if (Math.abs(d) < 2) { a.x = w.x; a.walk = null; a.anim = 'idle'; } else { a.x += Math.sign(d) * Math.min(Math.abs(d), 90 * dt); a.anim = 'walk'; } }
    }
    jumpTo(a, i, row) {
      if (i >= this.N) { a.jump = { t: 0, dur: 0.55, x0: a.x, y0: a.y, x1: this.stepX(this.N - 1) + STEP + 60 + (a.q || 0) * 12, y1: YN, end: true }; R6.Audio.sfx('jump', { vol: 0.4 }); return; }
      a.jump = { t: 0, dur: 0.5, x0: a.x, y0: a.y, x1: this.stepX(i), y1: this.rowY(row), i, row };
      a.state = 'jump'; a.hes = 0; R6.Audio.sfx('jump', { vol: 0.35 });
    }
    land(a, J) {
      if (J.end) { a.done = true; a.pos = this.N; a.state = 'done'; a.anim = 'celebrate'; if (a.isPlayer) this.playerSafe(); return; }
      const ok = this.safe[J.i] === J.row;
      if (ok) {
        a.pos = J.i; a.row = J.row; a.state = 'wait'; a.anim = 'idle';
        if (!this.revealed[J.i]) { this.revealed[J.i] = J.row; R6.Audio.sfx('glassTapHi', { vol: 0.5 }); }
        if (a.isPlayer && this.endless) { this.score = J.i + 1; }
      } else {
        this.broken[J.i][J.row] = true; this.revealed[J.i] = J.row === 'near' ? 'far' : 'near';
        R6.Audio.sfx('glass'); this.cam.shake(8, 0.4); R6.Engine.slowmo(0.35, 0.9);
        this.fx.emit('glass', this.stepX(J.i), this.rowY(J.row) + 4, 50, { spread: 45 });
        a.fall = { t: 0, vy: -80, y: 0, y0: a.y }; a.dead = true; a.state = 'fall';
        R6.Audio.sfx('scream', { delay: 0.1 });
        this.onFall(a);
      }
    }
    onFall(a) {
      if (a.isPlayer) { if (this.campaign) R6.State.eliminate(R6.State.player, 'glass'); this.score = Math.max(this.score, a.pos + 1); this.lose({ reason: 'O vidro quebrou', wait: 3.2 }); return; }
      if (a.p && !a.p.fake) R6.Elim.kill(a.p, { cause: 'glass', sfx: false, host: this });
      // the one behind reacts
      const b = this.queue[this.queue.indexOf(a) + 1]; if (b && !b.dead) b.hes += 1.5;
      // scripted beat: gangster & wild fall together
      if (a.p && a.p.key === 'gangster') { const w = this.queue.find(x => x.p && x.p.key === 'wild' && !x.dead && !x.done); if (w) { R6.Dialog.toast(w.p, 'EU DISSE QUE, SE EU MORRESSE, VOCÊ IA JUNTO!', 2.4); w.fall = { t: 0, vy: -40, y: 0, y0: w.y }; w.dead = true; w.state = 'fall'; if (w.p.alive) R6.Elim.kill(w.p, { cause: 'glass', sfx: false }); R6.Audio.sfx('scream', { delay: 0.3 }); } }
    }
    botThink(a, dt, isLeader) {
      if (a.walk) return;
      if (!isLeader) {
        // followers advance along known panels, keeping one step of distance
        const next = a.pos + 1;
        const ahead = this.queue[this.queue.indexOf(a) - 1];
        const limit = ahead ? (ahead.done ? this.N : ahead.pos - 1) : this.N;
        if (next < this.N && next <= limit && this.revealed[next] && !this.occupied(next, a) && Math.random() < dt * 1.5) this.jumpTo(a, next, this.revealed[next]);
        else if (next >= this.N && ahead && ahead.done && Math.random() < dt * 1.5) this.jumpTo(a, next);
        else if (a.pos === -1 && !a.walk) { const idx = this.queue.indexOf(a); const tx = 280 - (idx - this.queue.indexOf(this.leader())) * 34; if (Math.abs(a.x - tx) > 3 && tx <= 290) a.walk = { x: Math.min(290, tx) }; }
        return;
      }
      const next = a.pos + 1;
      if (next >= this.N) { this.jumpTo(a, next); return; }
      if (this.revealed[next]) { if (Math.random() < dt * 2) this.jumpTo(a, next, this.revealed[next]); return; }
      // must decide
      a.state = 'decide';
      a.hes += dt;
      const tr = a.p ? a.p.tr : { fear: 0.5, courage: 0.5 };
      const need = (a.needHes != null ? a.needHes : (a.needHes = U.rand(1.5, 4.5) + tr.fear * 6 - tr.courage * 2)) * (this.timeLeft < 60 ? 0.5 : 1);
      // glass-maker reads the panels while there is light
      if (a.p && a.p.key === 'glass') {
        if (!this.lightsOff && !this.lightsOffPending && a.hes > 1.2) { this.lightsOffPending = a.readCount >= 2 ? 0.01 : 0; }
        if (!this.lightsOff) { if (a.hes > 2.2) { a.readCount = (a.readCount || 0) + 1; a.needHes = null; this.jumpTo(a, next, Math.random() < 0.95 ? this.safe[next] : (this.safe[next] === 'near' ? 'far' : 'near')); if (a.readCount === 2) { this.lightsOffPending = 1.2; R6.Dialog.toast(a.p, 'Consigo ver a diferença… o temperado não distorce a luz.', 2.4); } } return; }
        // lights off: hesitates until pushed by the schemer
        if (a.hes > 5) { const sch = this.queue.find(x => x.p && x.p.key === 'schemer' && !x.dead && !x.done); if (sch && !a.pushed) { a.pushed = true; R6.Dialog.toast(sch.p, 'Não temos tempo para isso.', 2); this.push(a, sch); return; } }
        if (a.hes < 9) return;
      }
      // pushers behind get impatient
      const behind = this.queue[this.queue.indexOf(a) + 1];
      if (behind && !behind.dead && behind.p && behind.p.tr && behind.p.tr.betray > 0.75 && a.hes > need + 4 && !a.pushed && this.timeLeft < this.timeLimit * 0.6) { a.pushed = true; this.push(a, behind); return; }
      if (a.hes >= need) { a.needHes = null; this.jumpTo(a, next, Math.random() < 0.5 ? 'near' : 'far'); }
    }
    push(victim, by) {
      by.anim = 'push'; R6.Audio.sfx('grab'); R6.Engine.slowmo(0.4, 0.6);
      if (victim.isPlayer) { this.pushQTE = { t: 0, win: R6.Save.D(0.9, 0.7, 0.5), by }; return; }
      const next = victim.pos + 1;
      if (next < this.N) this.jumpTo(victim, next, Math.random() < 0.5 ? 'near' : 'far');
      if (by.isPlayer && victim.p && !victim.p.fake) { R6.State.addRel(victim.p, -60, 'pushed'); R6.State.s.stats.betrayals++; R6.State.karma(-4); R6.State.flag('pushed_on_bridge', true); }
    }
    updPlayer(dt, L) {
      const a = this.me; if (a.dead || a.done || a.jump) return;
      const I = R6.Input;
      if (this.pushQTE) {
        const q = this.pushQTE; q.t += dt;
        if (I.actP('action')) { this.pushQTE = null; R6.Audio.sfx('block'); R6.Toast.show('Você resistiu ao empurrão!', { color: '#2ec4b6' }); if (q.by.p && !q.by.p.fake) R6.State.addRel(q.by.p, -20, 'fought', { silent: true }); return; }
        if (q.t > q.win) { this.pushQTE = null; const next = a.pos + 1; if (next < this.N) this.jumpTo(a, next, Math.random() < 0.5 ? 'near' : 'far'); }
        return;
      }
      const isLeader = L === a;
      const next = a.pos + 1;
      // examine
      if (this.examine) {
        const e = this.examine; e.t += dt;
        if (!I.act('interact') && !e.done) { this.examine = null; return; }
        if (e.t >= e.dur && !e.done) {
          e.done = true;
          const acc = this.lights > 0.7 ? (this.hasHint ? 0.88 : 0.68) : (this.hasHint ? 0.6 : 0.52);
          const said = Math.random() < acc ? this.safe[e.i] : (this.safe[e.i] === 'near' ? 'far' : 'near');
          e.text = said === 'far' ? 'O painel do FUNDO parece mais sólido — reflete a luz sem distorção.' : 'O painel da FRENTE parece mais sólido — reflete a luz sem distorção.';
          if (this.lights < 0.7) e.text = 'Está escuro demais… ' + (said === 'far' ? 'talvez o do FUNDO?' : 'talvez o da FRENTE?');
          e.hold = 2.8;
        }
        if (e.done) { e.hold -= dt; if (e.hold <= 0) this.examine = null; }
      }
      if (I.actP('interact') && next < this.N && !this.revealed[next] && !this.examine) this.examine = { t: 0, dur: this.lights > 0.7 ? 2.5 : 3.5, i: next };
      // listen: throw the marble (if you have it) or tap with the foot
      if (I.actP('alt') && next < this.N && !this.revealed[next] && isLeader && !this.listenT) {
        const withMarble = this.hasMarble && !this.usedMarble;
        if (withMarble) this.usedMarble = true;
        this.listenT = 2.2;
        const acc = withMarble ? 0.97 : 0.72;
        const hiRow = Math.random() < acc ? this.safe[next] : (this.safe[next] === 'near' ? 'far' : 'near');
        R6.Audio.sfx('glassTapHi', { delay: 0.2 }); R6.Audio.sfx('glassTapLo', { delay: 0.9 });
        this.listenInfo = { t: 0, text: (withMarble ? 'Você joga a bolinha do velho. ' : 'Você bate no vidro com o pé. ') + 'O som agudo e firme veio do painel ' + (hiRow === 'far' ? 'do FUNDO.' : 'da FRENTE.') };
      }
      if (this.listenT) { this.listenT -= dt; if (this.listenT <= 0) this.listenT = 0; }
      if (this.listenInfo) { this.listenInfo.t += dt; if (this.listenInfo.t > 4) this.listenInfo = null; }
      // movement
      const ahead = this.queue[this.queue.indexOf(a) - 1];
      const limit = ahead && !ahead.dead ? (ahead.done ? this.N : ahead.pos - 1) : this.N;
      if (a.pos === -1 && !isLeader) { const idx = this.queue.indexOf(a); const tx = Math.min(290, 280 - (idx - this.queue.indexOf(L)) * 34); if (Math.abs(a.x - tx) > 3) a.walk = { x: tx }; }
      if (I.actP('right') && next <= limit) {
        if (next >= this.N) this.jumpTo(a, next);
        else if (this.revealed[next] && !this.occupied(next, a)) this.jumpTo(a, next, this.revealed[next]);
      }
      if (isLeader && next < this.N && !this.revealed[next]) {
        a.state = 'decide'; a.hes += dt;
        if (I.actP('up')) this.jumpTo(a, next, 'far');
        else if (I.actP('down')) this.jumpTo(a, next, 'near');
        // someone behind might push you if you hesitate too long
        const behind = this.queue[this.queue.indexOf(a) + 1];
        if (behind && !behind.dead && behind.p && behind.p.tr && behind.p.tr.betray > 0.7 && a.hes > 14 && !a.pushed && this.timeLeft < this.timeLimit * 0.7) { a.pushed = true; R6.Dialog.toast(behind.p, 'Anda logo!', 1.5); this.push(a, behind); }
      }
      // player may push the one ahead (betrayal)
      if (I.actP('interact') && ahead && !ahead.dead && !ahead.done && ahead.state === 'decide' && Math.abs(ahead.x - a.x) < 140 && ahead.pos === a.pos + 1 && !this.examine) { a.anim = 'push'; this.push(ahead, a); }
    }
    playerSafe() {
      R6.Audio.sfx('pass'); R6.Banner.show('VOCÊ ATRAVESSOU', 'Aguarde o fim do tempo…', { dur: 2.4, color: '#2ec4b6' });
      if (this.endless) { this.chips = this.score * 4; this.win({ title: 'FIM DA PONTE?!' }); return; }
      if (this.campaign) {
        // injured thief (story), schemer survives if alive
        const th = this.queue.find(x => x.p && x.p.key === 'thief' && !x.dead);
        if (th) R6.State.flag('thief_injured', true);
      }
      this.fastEnd = true;
    }
    explode() {
      this.exploded = true; this.explT = 0;
      R6.Audio.sfx('buzzer'); R6.Audio.sfx('glass', { delay: 0.4 }); R6.Audio.sfx('glass', { delay: 0.8 }); this.cam.shake(14, 1.2);
      for (let i = 0; i < this.N; i++) { this.broken[i].near = this.broken[i].far = true; this.fx.emit('glass', this.stepX(i), YN, 12, { spread: 50 }); }
      for (const a of this.queue) if (!a.done && !a.dead) { a.dead = true; a.fall = { t: 0, vy: -100, y: 0, y0: a.y }; if (a.isPlayer) { if (this.campaign) R6.State.eliminate(R6.State.player, 'glass'); this.lose({ reason: 'O tempo acabou' }); } else if (a.p && !a.p.fake) R6.Elim.kill(a.p, { cause: 'glass', sfx: false, silent: true }); }
    }
    finishWin() { this.chips = 90; this.win({ sub: 'PLAYERS REMAINING: ' + (R6.State.s ? R6.State.alive : this.queue.filter(a => a.done).length) }); }
    debugWin() {
      if (this.stage === 'vest') this.pickVest();
      this.phase = 'play'; this.stage = 'play';
      // resolve: everyone before the player falls/crosses quickly, player crosses
      for (let i = 0; i < this.N; i++) this.revealed[i] = this.safe[i];

      if (L && L !== this.me && L.state === 'decide' && !L.jump) R6.UI.text(ctx, '#' + U.pad(L.p ? L.p.num : 0) + ' está hesitando…', 640, R6.H - 70, { size: 16, align: 'center', color: '#ddd', weight: 700, shadow: true });
    }
    drawVest(ctx) {
      ctx.fillStyle = 'rgba(0,0,0,.72)'; ctx.fillRect(0, 0, R6.W, R6.H);
      R6.UI.text(ctx, 'ESCOLHA UM NÚMERO', 640, 90, { size: 56, fam: 'title', align: 'center', color: '#fff', spacing: 4 });
      R6.UI.text(ctx, 'Os coletes foram dispostos em ordem. Você não sabe para que serve o número.', 640, 126, { size: 17, align: 'center', color: '#bbb' });
      const n = this.people.length + 1; this.vRects = [];

      const w = Math.min(110, (1180 - (cols - 1) * g) / cols), h = Math.min(90, (500 - (rows - 1) * g) / rows), x0 = 640 - (cols * w + (cols - 1) * g) / 2;

<script>/* js/games/squidfinal.js */
/* ROUND 6 — squidfinal.js : Squid Game (S1 final) — side-view brawler in the rain: hop until the waist, punches/combos,

'use strict';
(function () {
  const U = R6.U, TAU = U.TAU;

    }

      this.vy += 1800 * dt; this.y += this.vy * dt; if (this.y > 0) { if (this.vy > 300 && this.state === 'air') { R6.Audio.sfx('land', { vol: 0.5 }); arena.fx.emit('splash', this.x, GROUND, 8); } this.y = 0; this.vy = 0; if (this.state === 'air') this.set('idle', 'idle'); }

      if (this.state === 'hit' || this.state === 'knock' || this.state === 'dodge' || this.state === 'thrown') this.vx *= Math.exp(-fric * dt * 0.6); else if (this.state !== 'walk' && this.state !== 'air') this.vx *= Math.exp(-fric * dt);

      if (this.state === 'attack' && this.t > this.atk.dur) this.set('idle', 'idle');
      if (this.state === 'dodge' && this.t > 0.42) this.set('idle', 'idle');
      if (this.state === 'knock' && this.t > 1.2 && this.hp > 0) this.set('getup', 'getup');
      if (this.state === 'getup' && this.t > 0.8) { this.set('idle', 'idle'); this.inv = 0.5; }
      if (this.state === 'thrown' && this.grounded && this.t > 0.3) this.set('knock', 'lie');

    }
    canAct() { return this.state === 'idle' || this.state === 'walk' || (this.state === 'attack' && this.atk && this.t > this.atk.dur * 0.7); }
  }

  const ATK = {
    p1: { dur: 0.32, act: [0.08, 0.17], range: 58, dmg: 6, kb: 90, st: 7, anim: 'punch' },
    p2: { dur: 0.32, act: [0.08, 0.17], range: 58, dmg: 7, kb: 110, st: 7, anim: 'punch2' },
    p3: { dur: 0.5, act: [0.14, 0.26], range: 66, dmg: 12, kb: 300, st: 12, anim: 'punch', knock: 0.35 },
    kick: { dur: 0.55, act: [0.14, 0.28], range: 78, dmg: 9, kb: 420, st: 16, anim: 'kick' },
    heavy: { dur: 0.7, act: [0.3, 0.42], range: 70, dmg: 16, kb: 380, st: 20, anim: 'push', knock: 0.8 },
  };

  class SquidFinal extends R6.GameBase {
    constructor(opts = {}) {
      super(opts);
      this.gameId = 'squidfinal'; this.name = 'squidfinal';
      const S = R6.State;
      this.oppP = opts.opponent || (S.s ? (S.byKey('schemer') && S.byKey('schemer').alive ? S.byKey('schemer') : S.aliveBots().sort((a, b) => (b.key ? 1 : 0) - (a.key ? 1 : 0) || b.tr.str - a.tr.str)[0]) : null);

        title: 'SQUID GAME', icon: 'triangle', sub: 'O JOGO FINAL · ATACANTE CONTRA DEFENSOR · NA CHUVA',
        lines: [
          'Chegue à CABEÇA da lula (à direita) e pressione E — ou derrube o defensor.',
          'Até passar a CINTURA da lula você só pode pular em um pé (lento e vulnerável).',
          'Se for empurrado para fora da linha à esquerda, você perde.',
          'J soco (combo) · K chute/empurrão · L agarrar e arremessar · I/CTRL bloquear · SHIFT esquiva · W pular',
        ],
        keys: [['A D', 'mover'], ['J K L', 'atacar'], ['I', 'bloquear'], ['SHIFT', 'esquivar'], ['E', 'tocar a cabeça']],

    }
    begin() {
      R6.Music.play('action'); R6.Music.setIntensity(0.4);
      R6.Audio.loop('rain', 0.9); R6.Audio.loop('wind', 0.25);
      R6.Dialog.announce('Jogo final: Squid Game. O atacante vence se tocar a cabeça da lula. Que comece.', null, 2.8);
      R6.Engine.after(1.2, () => { if (this.oppP && this.oppP.key === 'schemer') R6.Dialog.toast(this.oppP, 'Você nunca ganhou de mim em nada. Nem na rua, nem aqui.', 3); });
    }
    focus() { const s = this.cam.toScreen(this.P.x, GROUND); return { x: s.x, y: s.y, look: this.P.look, scale: 1.4 * this.cam.zoom, facing: 1 }; }
    // ------------------------------------------------ combat core
    startAttack(f, key) {
      const a = ATK[key]; if (f.st < a.st * 0.5) { if (f.isPlayer) R6.Toast.show('Sem fôlego!', { color: '#ff5a6a' }); return; }
      f.atk = Object.assign({ key, hit: false }, a); f.set('attack', a.anim); f.st -= a.st; R6.Audio.sfx('punchAir', { vol: 0.6 });

    }
    resolveHits(att, def) {
      if (att.state !== 'attack' || !att.atk || att.atk.hit) return;
      const a = att.atk; if (att.t < a.act[0] || att.t > a.act[1]) return;
      const dx = (def.x - att.x) * att.dir;

      if (def.state === 'block' && facing && def.guard > 0) {
        def.guard -= a.dmg * 3.2; def.vx += att.dir * a.kb * 0.35; R6.Audio.sfx('block'); this.fx.emit('spark', def.x - att.dir * 10, GROUND - 80, 6);
        if (def.guard <= 0) { def.set('hit', 'stagger'); def.guard = 0; R6.Toast.show(def.isPlayer ? 'Sua guarda quebrou!' : 'Guarda quebrada!', { color: '#ffd166' }); }

      R6.Audio.sfx(a.dmg >= 12 ? 'hitHeavy' : 'hit'); this.cam.shake(a.dmg >= 12 ? 9 : 4, 0.2);

        { t: 'Terminar o jogo — caminhar até a cabeça da lula', cb: () => { R6.State.s && R6.State.decide('s1_final', 'finish', 'Terminou o jogo'); this.walkToHead = true; } },

    }

      S.decide('s1_final', 'mercy', 'Estendeu a mão'); S.flag('s1_mercy', true); S.karma(4);
      this.P.set('idle', 'point');

    render(ctx) {

      const g = ctx.createRadialGradient(640, 420, 60, 640, 420, 600); g.addColorStop(0, '#a47a52'); g.addColorStop(1, '#5a3d28'); ctx.fillStyle = g; ctx.fillRect(0, 0, R6.W, R6.H);

  const STATIONS = { ddakji: DdakjiStation, stone: StoneStation, gonggi: GonggiStation, top: TopStation, jegi: JegiStation };

  // standalone station scene (practice / extras)

  for (const k of ['stone', 'gonggi', 'top', 'jegi']) R6.registerGame(k, { name: ST_NAME[k], season: 2, icon: 'circle', desc: 'Minijogo do pentatlo.', create: o => new StationScene(Object.assign({ station: k }, o)) });

  // =================================================================== SIX LEGS
  class SixLegs extends R6.GameBase {
    constructor(opts = {}) {

      this.cam = new R6.Camera({ bounds: { x: 0, y: 0, w: 3600, h: 760 } }); this.cam.set(400, 400, 1);
      this.stX = [700, 1250, 1800, 2350, 2900]; this.finishX = 3350;

      this.buildTeam();
    }
    rules() {

        title: 'SEIS PERNAS', icon: 'square', sub: 'PENTATLO EM EQUIPE · 5 JOGADORES AMARRADOS',
        lines: ['Vocês estão amarrados pelos tornozelos. Andem juntos: A e D alternados, no ritmo.', 'Em cada estação, o jogador escalado precisa vencer o minijogo.', 'Quando for a vez de um companheiro, E dá apoio (aumenta a chance dele).', 'Se o tempo acabar antes da linha final, a equipe inteira é eliminada.'],

    }

      const S = R6.State;
      let mates;
      if (this.campaign && S.s) {
        const allies = S.allies(20).slice(0, 4);
        const rest = U.shuffle(S.aliveBots().filter(p => !allies.includes(p) && !p.secret)).slice(0, 4 - allies.length);
        mates = allies.concat(rest);
      } else mates = Array.from({ length: 4 }, (_, i) => { const tr = { spd: Math.random(), str: Math.random(), intel: Math.random(), fear: Math.random(), courage: Math.random(), precision: Math.random(), kindness: 0.5, trust: 0.5, loyalty: 0.5, chaos: 0.3 }; return { num: 40 + i * 31, name: R6.Roster.genName(new U.RNG(i + 3)), look: R6.Char.makeLook({ num: 40 + i * 31 }), tr, sk: R6.Roster.skillsOf(tr), rel: 20, fake: true, alive: true }; });

      for (const p of bots) { let best = null, bv = -1; for (const s of free) { const v = ST_SKILL[s](p); if (v > bv) { bv = v; best = s; } } this.assign[best] = p; free.splice(free.indexOf(best), 1); }

    }
    swapAssign(i) {

    }
    begin() {
      this.phaseS = 'march'; R6.Music.play('game'); R6.Music.setIntensity(0.3); R6.Audio.loop('crowd', 0.25);
      if (this.campaign) R6.State.decide('sixlegs_station', ST_ORDER.find(k => this.assign[k] === 'player'), '');
      R6.Dialog.announce('Pentatlo de seis pernas. Cinco minutos. Boa sorte.', null, 2.4);
    }
    focus() { const s = this.cam.toScreen(this.x, 560); return { x: s.x, y: s.y, look: plLook(), scale: 1.2, facing: 1 }; }
    update(dt) {

    updAssign(dt) {

<script>/* js/games/mingle.js */
/* ROUND 6 — mingle.js : Mingle — giant spinning carousel, number calls, rooms with doors, chaotic group-forming AI

'use strict';

  const U = R6.U, TAU = U.TAU;

  class Mingle extends R6.GameBase {
    constructor(opts = {}) {

      this.platAng = 0; this.omega = 0; this.callN = 0; this.callTime = 0;
      this.build();
    }
    rules() {
      return {
        title: this.extreme ? 'MINGLE EXTREME' : 'MINGLE', icon: 'circle', sub: 'A PLATAFORMA GIRA · A MÚSICA PARA · UM NÚMERO É CHAMADO',
        lines: ['Fique na plataforma enquanto ela gira.', 'Quando anunciarem "GRUPO DE N", entre numa sala com EXATAMENTE N pessoas.', 'N−1 ou N+1 = eliminados. Fora de uma sala = eliminado.', 'E: fechar/abrir a porta · empurrar alguém para fora · puxar alguém para o seu grupo.', 'Q: chamar seus aliados para te seguir.'],
        keys: [['WASD', 'mover'], ['SHIFT', 'correr'], ['E', 'porta / puxar / empurrar'], ['Q', 'chamar aliados']],
      };
    }
    build() {
      const S = R6.State; const look = S.s ? S.s.player.look : R6.Char.makeLook({ num: 456 });
      this.pl = this.world.add(new R6.Actor({ p: S.s ? S.player : null, look, x: CX, y: CY + 120, isPlayer: true, speed: 95, runSpeed: 165, id: 'player', scale: 0.46 }));
      let bots = this.campaign && S.s ? S.aliveBots() : Array.from({ length: this.extreme ? 90 : 120 }, (_, i) => { const tr = { courage: Math.random(), intel: Math.random(), fear: Math.random(), spd: Math.random(), str: Math.random(), kindness: Math.random(), betray: Math.random() * 0.8, chaos: Math.random() * 0.6, loyalty: Math.random(), trust: Math.random() }; return { num: i + 2, look: R6.Char.makeLook({ num: i + 2 }), tr, rel: U.randi(-20, 40), fake: true, alive: true, friends: [] }; });

        const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * (RP - 30);
        const b = this.world.add(new R6.Actor({ p: p.fake ? null : p, look: p.look, x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r, speed: 75 + p.tr.spd * 30, runSpeed: 130 + p.tr.spd * 60, scale: 0.46 }));
        b.bot = p; b.ai = { room: null, t: 0, react: 0.2 + p.tr.fear * 0.6 + (1 - p.tr.intel) * 0.4, follow: null, re: 0 };
        b.brain = (x, dt) => this.botBrain(x, dt);
      });
      this.guards = [0, 1, 2, 3, 4, 5].map(i => { const a = i / 6 * TAU; const g = this.world.add(new R6.Actor({ look: R6.Char.makeLook({ outfit: 'guard', mask: ['circle', 'triangle', 'square'][i % 3], seed: 40 + i }), x: CX + Math.cos(a) * (RA - 40), y: CY + Math.sin(a) * (RA - 40), solid: false })); g.item = 'rifle'; g.frozen = true; g.faceTo(CX, CY); g.kind = 'guard'; return g; });
    }
    begin() { R6.Audio.loop('crowd', 0.35); this.startSpin(); }
    focus() { const s = this.cam.toScreen(this.pl.x, this.pl.y); return { x: s.x, y: s.y, look: this.pl.look, scale: 0.46 * this.cam.zoom, facing: 1 }; }
    // geometry helpers
    polar(x, y) { const dx = x - CX, dy = y - CY; return { r: Math.hypot(dx, dy), a: Math.atan2(dy, dx) }; }
    roomAt(a, r) { if (r < RA - 4) return null; for (const R of this.rooms) if (Math.abs(U.angDiff(R.a, a)) < R.half) return R; return null; }
    roomPoint(R, k = 0.5) { const r = RA + 30 + k * 60; return { x: CX + Math.cos(R.a) * r, y: CY + Math.sin(R.a) * r }; }
    doorPoint(R) { return { x: CX + Math.cos(R.a) * (RA - 24), y: CY + Math.sin(R.a) * (RA - 24) }; }
    // ------------------------------------------------ phases
    startSpin() {
      this.state = 'spin'; this.stateT = 0; this.round++; this.spinDur = U.rand(7, 11) * (this.extreme ? 0.6 : 1);
      this.rooms.forEach(R => { R.open = false; R.closedBy = null; });

      R6.Dialog.announce(this.round === 1 ? 'Subam na plataforma. Quando a música parar, formem grupos com o número anunciado.' : 'Rodada ' + this.round + '. Voltem para a plataforma.', null, 2.6);
      for (const a of this.world.actors) if (a.ai && !a.dead) { a.ai.room = null; a.ai.follow = a.ai.follow && Math.random() < 0.6 ? a.ai.follow : null; const pp = this.polar(a.x, a.y); if (pp.r > RP - 20) { const ang = Math.random() * TAU; a.goTo(this.world, CX + Math.cos(ang) * U.rand(40, RP - 40), CY + Math.sin(ang) * U.rand(40, RP - 40), false); } }

      this.state = 'judge'; this.stateT = 0;
      this.rooms.forEach(R => R.open = false); R6.Audio.sfx('doorSlam'); R6.Music.stop(0.2); R6.Audio.sfx('buzzer');
      this.countRooms();

      for (const a of this.world.actors) {
        if ((!a.ai && a !== this.pl) || a.dead) continue;
        const pp = this.polar(a.x, a.y); const R = this.roomAt(pp.a, pp.r);
        const ok = R && R.count === this.callN;
        if (!ok) victims.push({ a, R });
      }

      this.victims = victims; this.vi = 0; this.vT = 0.6;
    }
    // ------------------------------------------------ AI
    botBrain(a, dt) {
      const ai = a.ai; ai.t += dt;
      if (this.phase !== 'play') { a.steer(0, 0); return; }
      if (this.state === 'spin' || this.state === 'reset') {
        if (!a.path && Math.random() < dt * 0.15) { const ang = Math.random() * TAU, r = U.rand(30, RP - 40); a.goTo(this.world, CX + Math.cos(ang) * r, CY + Math.sin(ang) * r, false); }
        return;
      }
      if (this.state !== 'call') { a.steer(0, 0); return; }
      if (ai.t < ai.react) return;
      if (ai.panicT > 0) { ai.panicT -= dt; if (!a.path || Math.random() < dt) { const ang = Math.random() * TAU; a.goTo(this.world, CX + Math.cos(ang) * U.rand(100, RA - 60), CY + Math.sin(ang) * U.rand(100, RA - 60), true); } return; }

      if (ai.follow === this.pl && !this.pl.dead) {
        const pp = this.polar(this.pl.x, this.pl.y); const inRoom = this.roomAt(pp.a, pp.r);

        else if (U.dist(a.x, a.y, this.pl.x, this.pl.y) > 40) { ai.re -= dt; if (ai.re <= 0) { ai.re = 0.4; a.goTo(this.world, this.pl.x + U.rand(-20, 20), this.pl.y + U.rand(-20, 20), true); } }

          const mem = cur.members.filter(m => m !== a);
          const myStatus = a.bot.tr.str + (a.bot.friends ? mem.filter(m => m.bot && a.bot.friends.includes(m.bot.id)).length * 0.3 : 0);
          if (a.bot.tr.str > 0.7 && a.bot.tr.betray > 0.5 && Math.random() < dt * 1.5) { const weak = mem.filter(m => m !== this.pl || true).sort((x, y) => (x.bot ? x.bot.tr.str : 0.5) - (y.bot ? y.bot.tr.str : 0.5))[0]; if (weak) this.pushOut(weak, a); }
          else if (myStatus < 0.6 && Math.random() < dt * (0.6 + a.bot.tr.kindness)) { ai.room = null; this.leaveRoom(a, cur); }
        } else if (cur.count === this.callN) {
          if (cur.open && a.bot.tr.intel > 0.35 && Math.random() < dt * 2.5) this.setDoor(cur, false, a);
        } else if (cur.count < this.callN) {
          if (!cur.open && Math.random() < dt * 2) this.setDoor(cur, true, a);
          if (this.callTime - this.stateT < 8 && Math.random() < dt * 0.3 && cur.count < this.callN - 1) { ai.room = null; this.leaveRoom(a, cur); }
        }

      }

      if (!ai.room || ai.room.count >= this.callN || !ai.room.open || Math.random() < dt * 0.2) {
        let best = null, bv = -1e9;
        for (const R of this.rooms) {
          if (!R.open) continue;
          const d = Math.abs(U.angDiff(R.a, me.a)) * RA + Math.max(0, RA - me.r);
          const need = this.callN - R.count - (R.incoming || 0);
          let v = -d * 0.01 + (need > 0 ? 4 : -8) + (need === 1 ? 3 : 0);

        lines: this.survival ? ['Fique no centro da corda e pule a cada volta.', 'A velocidade aumenta sem parar.', 'W/ESPAÇO pular (segure para pular mais alto).'] :

<script>/* js/games/escape.js */
/* ROUND 6 — escape.js : The Escape — top-down facility with guards, cameras, alarms, lockdown, items and four routes:

        { id: 'flashlight', x: M.cellAt(2, 6).center.x, y: M.cellAt(2, 6).center.y, label: 'LANTERNA', taken: false },

        { x: M.cellAt(1, 2).center.x, y: M.cellAt(1, 2).center.y, text: 'Bilhete amassado: "Os convidados de máscara dourada nunca usam o elevador. Eles saem por trás do QUADRO DOURADO na sala de estar." ', reveals: 'C' },

  // ------------------------------------------------ CLOCK RUN

    }
    drawArena(ctx) {

  // ------------------------------------------------ COLOR ROOMS
  const COLORS = [['VERMELHO', '#e84a5f'], ['AZUL', '#3a86ff'], ['VERDE', '#2ec46b'], ['AMARELO', '#f2c14e'], ['ROXO', '#9b5de5'], ['LARANJA', '#ff8c42']];
  class ColorRooms extends ArenaExtra {

<script>/* js/scenes/hub.js */
/* ROUND 6 — hub.js : the dormitory — explorable top-down hub with bunk towers, prize piggy bank, dining, bathroom, restricted area,
   guards & cameras; bot routines (sleep, eat, talk, argue, alliances, watch the prize), social interactions (talk, share, ally,
   persuade, provoke, steal, comfort), random events, meals, votes (O/X), night riot, and the procession to the next game */
'use strict';
(function () {
  const U = R6.U, TAU = U.TAU, T = R6.T;
  const TS = 32, MW = 64, MH = 44;

  // ------------------------------------------------ dorm map
  function buildDorm(season) {
    const map = new R6.TileMap(MW, MH, TS);
    map.fill(0, 0, MW - 1, MH - 1, T.WALL, 6);
    map.fill(2, 6, MW - 3, MH - 3, T.FLOOR, 0);                 // main hall
    map.fill(29, 1, 34, 5, T.FLOOR, 2);                          // stairs corridor (exit)
    map.fill(2, 35, 12, MH - 3, T.FLOOR, 1); map.fill(3, 34, 11, 34, T.WALL, 6); map.set(7, 34, T.FLOOR, 1); // bathroom
    map.fill(MW - 9, 6, MW - 3, 12, T.FLOOR, 3); map.fill(MW - 10, 6, MW - 10, 12, T.WALL, 6);              // restricted room
    const exitDoor = [map.addDoor(31, 5, { color: '#3a3f4a' }), map.addDoor(32, 5, { color: '#3a3f4a' })];
    const sealed = map.addDoor(MW - 10, 9, { locked: true, color: '#8a1f33', horiz: false });
    // bunk blocks (LOW tiles) 3x3
    const bunks = [];
    const cols = [4, 9, 14, 45, 50, 55], rows = [8, 14, 20, 26];
    for (const bx of cols) for (const by of rows) {
      if (bx >= 45 && by === 8) continue; // restricted room corner
      map.fill(bx, by, bx + 2, by + 1, T.LOW);
      for (let lv = 0; lv < 5; lv++) bunks.push({ bx, by, lv, x: (bx + 1.5) * TS + (lv - 2) * 10, y: (by + 2.6) * TS, taken: null });
    }
    // dining tables
    const tables = [];
    for (let i = 0; i < 3; i++) { const tx = 22 + i * 7, ty = 33; map.fill(tx, ty, tx + 4, ty, T.LOW); tables.push({ tx, ty, x: (tx + 2.5) * TS, y: ty * TS }); }

    } },
  ];

      talk: keyTalk({ glass: () => { R6.State.flag('hint_glass', true); return [{ text: 'Eu trabalhei 30 anos numa fábrica de vidro. Vidro temperado e vidro comum refletem a luz de um jeito diferente.' }, { text: 'Se houver luz forte, eu consigo ver. Se apagarem as luzes… aí é sorte.' }]; } }) }) },
    { id: 'g_glass', season: 1, run: game('glassbridge', {}, 'view') },
    { id: 's1_dinner', season: 1, run: cut(n => R6.Story.s1Dinner(n)) },
    { id: 'g_squid', season: 1, when: () => !S().flag('s1_clause3'), run: game('squidfinal', {}, 'fade') },
    { id: 's1_clause3', season: 1, when: () => !!S().flag('s1_clause3'), run: cut(n => R6.Story.s1Clause3End(n)) },
    { id: 's1_end', season: 1, run: cut(n => R6.Story.s1End(n)) },

    { id: 's2_season', season: 2, run: (next) => { startSeason(2); go(R6.Story.s2Intro(next), 'fade'); } },

    { id: 's2_arrival', season: 2, run: cut(n => R6.Story.s2Arrival(n)) },
    { id: 'h2_arrival', season: 2, run: hub({ id: 'h2a', season: 2, title: 'TEMPORADA 2 · DIA 1', intro: h => R6.Story.hubWakeS2(h), events: 1, minTime: 25, tasks: [{ id: 'talk_any', text: 'Converse com alguém' }],
      talk: keyTalk({ buddy: 'Lembra quando a gente roubava pêssegos da feira? Parecia o fim do mundo levar bronca.', fm001: 'Estou aqui pela minha filha. Tratamento caro. E você? Você já esteve aqui antes, não esteve?', soldier: 'Se precisar de alguém que saiba lutar, sabe onde me achar.', mother: 'Por favor, não conta pra ninguém que eu estou grávida.', crypto: 'Ei, ei. Se você souber alguma coisa sobre os jogos, a gente divide a informação, beleza?' }) }) },

    { id: 'h2_vote1', season: 2, run: hub({ id: 'h2v1', season: 2, title: 'VOTAÇÃO', voteAfter: 30, askIntent: true, vote: Object.assign({}, R6.VOTES.v2_1), noLeave: true, events: 0, minTime: 0,
      intro: h => R6.Story.hubAfterRL(h) }) },

      talk: keyTalk({ fm001: 'Os do X estão ficando nervosos. Fique perto de mim hoje à noite.', soldier: 'O grupo do O está afiando colheres. Não durma.' }) }) },
    { id: 'g_sixlegs', season: 2, run: game('sixlegs', {}, 'view') },
    { id: 'h2_vote2', season: 2, run: hub({ id: 'h2v2', season: 2, title: 'VOTAÇÃO', voteAfter: 25, askIntent: true, vote: Object.assign({}, R6.VOTES.v2_2), noLeave: true, events: 0, minTime: 0 }) },
    { id: 'g_mingle', season: 2, run: game('mingle', {}, 'iris') },
    { id: 'h2_vote3', season: 2, run: hub({ id: 'h2v3', season: 2, title: 'A ÚLTIMA VOTAÇÃO', voteAfter: 25, askIntent: true, vote: Object.assign({}, R6.VOTES.v2_3, { after: (h, res) => h.run(R6.Story.s2RevoltPlan(h), () => h.done({ vote: res })) }), noLeave: true, events: 0, minTime: 0 }) },

    { id: 's2_end', season: 2, run: cut(n => { revoltConsequences(); return R6.Story.s2End(n); }) },

    { id: 's3_season', season: 3, run: (next) => { startSeason(3); go(R6.Story.s3Intro(next), 'fade'); } },
    { id: 'h3_1', season: 3, run: hub({ id: 'h3a', season: 3, title: 'TEMPORADA 3 · DIA 1', night: true, events: 1, minTime: 20, tasks: [{ id: 'talk_any', text: 'Converse com alguém' }],
      talk: keyTalk({ soldier: 'Não foi culpa sua. Eles sabiam de tudo desde o começo.', mother: 'Está chegando a hora. Eu sinto. E se nascer aqui dentro?', crypto: 'Eu… eu não tive nada a ver com a traição, tá? Eu nem estava lá.' }) }) },

    { id: 'g_jumprope', season: 3, run: game('jumprope', {}, 'view') },

  function endingThenCredits(id, winnerScreen) {
    R6.Endings.play(id, () => {
      const after = () => go(R6.CreditsScene(() => { R6.Save.clearCampaign(); go(R6.MenuScene(), 'fade'); }), 'fade');
      if (winnerScreen) go(R6.WinnerScene(() => after()), 'fade'); else after();
    });
  }
  function completeCampaign() { const m = R6.Save.meta; m.seasonsUnlocked = 3; for (const id in R6.Games) m.gamesUnlocked[id] = true; m.campaignDone = (m.campaignDone || 0) + 1; R6.Save.saveMeta(); }

  function startSeason(n) {
    const s = S().s; s.season = n; s.day = 1;
    if (n === 2) { s.flags.badge = null; S().buildRoster(2); R6.Elim.reset(); }
    if (n === 3) { /* roster continues from season 2 */ }
    R6.Save.meta.seasonsUnlocked = Math.max(R6.Save.meta.seasonsUnlocked, n); R6.Save.saveMeta();
  }
  function revoltConsequences() {
    const st = S();
    // the failed revolt: many rebels (X voters) are executed; trusting #001 costs more lives
    const susp = st.flag('suspect_001');
    for (const p of st.aliveBots()) { if (p.key) continue; if (p.lastVote === 'X' && Math.random() < (susp ? 0.45 : 0.7)) R6.Elim.kill(p, { cause: 'revolt', silent: true }); }
    if (!susp && st.keyAlive('marine')) R6.Elim.kill(st.byKey('marine'), { cause: 'revolt', silent: true, noCard: true });
    if (!susp && st.keyAlive('soldier') && Math.random() < 0.5) { R6.Elim.kill(st.byKey('soldier'), { cause: 'revolt', silent: true, noCard: true }); }
    if (st.keyAlive('fm001')) { const p = st.byKey('fm001'); p.alive = false; p.cause = 'frontman'; st.alive--; } // the infiltrator simply leaves the game
    // ensure a sensible number of players for season 3
    const bots = st.aliveBots().filter(p => !p.key);
    while (bots.length > 58) { const p = bots.splice(Math.floor(Math.random() * bots.length), 1)[0]; R6.Elim.kill(p, { silent: true }); }
  }

  const Campaign = {
    CH,
    idx: 0,
    active: false,
    start(profile) {
      Campaign.active = true;
      S().newGame(profile); R6.Elim.reset();
      Campaign.run(0);
    },
    run(i, res) {
      // skip chapters whose condition is false
      while (i < CH.length && CH[i].when && !CH[i].when()) i++;
      if (i >= CH.length) { go(R6.MenuScene(), 'fade'); return; }
      Campaign.idx = i; S().s.chapter = i; Campaign.active = true;
      const ch = CH[i];
      S().checkpoint(ch.id);
      R6.Elim.reset();
      try { ch.run((r) => Campaign.next(r), res); } catch (e) { R6.Engine.reportError(e); }
    },
    next(res) {
      const cur = CH[Campaign.idx];
      // S2 vote 1: a decisive X means the exodus ending
      if (cur && cur.id === 'h2_vote1' && S().flag('v2_1_result') === 'X') S().flag('exodo', true);
      Campaign.run(Campaign.idx + 1, res);
    },
    retry() {
      if (!S().reloadCheckpoint()) { go(R6.MenuScene(), 'fade'); return; }
      Campaign.active = true;
      R6.Elim.reset();
      const i = S().s.chapter || 0;
      Campaign.idx = i;
      try { CH[i].run(r => Campaign.next(r)); } catch (e) { R6.Engine.reportError(e); }
    },
    continueSave() {
      const d = R6.Save.readCampaign(); if (!d) return false;
      S().restore(d.state); R6.Elim.reset(); S().lastCheckpoint = d; Campaign.active = true;
      const i = d.state.chapter || 0; Campaign.idx = i;
      try { CH[i].run(r => Campaign.next(r)); } catch (e) { R6.Engine.reportError(e); }
      return true;
    },
    // start a campaign directly at a season (season select) with plausible prior history
    startSeason(n, profile) {
      S().newGame(profile); Campaign.active = true;
      const st = S();
      if (n >= 2) {
        st.s.flags.s1_winner = true; st.s.player.gamesWon = 6; st.s.player.money = 45.6e9;
        startSeason(2);
      }
      if (n >= 3) {
        startSeason(3);
        // simulate season 2 results
        for (const p of st.aliveBots()) { if (p.key === 'fm001') { p.alive = false; st.alive--; continue; } if (!p.key && Math.random() < 0.86) R6.Elim.kill(p, { silent: true }); }
        if (st.keyAlive('buddy') && Math.random() < 0.5) st.byKey('buddy').alive = false;
        st.recount(); st.s.flags.revolt_reached = true;
      }
      R6.Elim.reset();
      const id = n === 1 ? 's1_intro' : n === 2 ? 's2_season' : 's3_season';
      const i = CH.findIndex(c => c.id === id);
      if (n >= 2) { Campaign.idx = i; st.s.chapter = i; st.checkpoint(id); CH[i].run = CH[i].run; if (n === 2) { go(R6.Story.s2Intro(() => Campaign.next()), 'fade'); } else { go(R6.Story.s3Intro(() => Campaign.next()), 'fade'); } return; }
      Campaign.run(i);
    },
    chapterName(i) { const c = CH[i]; return c ? c.id : '?'; },
  };
  R6.Campaign = Campaign;
})();

</script>
<script>/* js/scenes/endings.js */

  R6.ENDINGS = ENDINGS;

  function pickEnding(route) {
    const s = S();

    if (route === 'C') return 'dark';
    if (route === 'D') return 'segredo';

  const Endings = {
    pick: pickEnding,
    play(id, next) {

    card(id) { return [{ music: null }, { caption: ENDINGS[id].title, sub: ENDINGS[id].desc, dur: 4.5, big: true }]; },
    vitoria(next) {

        id: 'end_vitoria', stage: 'elevator', music: 'dread', stageProps: el, cam: [640, 380, 1.3],

        onUpdate: (sc, dt) => { sc.ft = (sc.ft || 0) + dt; const f = Math.max(-7, Math.min(1, -7 + Math.floor(sc.ft / 0.7))); el.floor = f <= 0 ? 'B' + Math.abs(f - 0) : 'T'; if (f === 1) el.floor = 'TÉRREO'; },
        steps: [{ sfx: 'elevator' }, { narr: 'As portas se fecham. Os números sobem. Ninguém te segue.' }, { wait: 3.5 }, { sfx: 'ding' }, { narr: 'Luz do dia. De verdade.' }],

    fuga(next) {

        actors: [{ id: 'p', look: L().me(), x: -80, dir: 1 }, { id: 'g', look: L().guard('triangle', 71), x: -500, dir: 1, item: 'flashlight' }],
        steps: [

        actors: [{ id: 'p', look: L().me(), x: 150, dir: 1 }, { id: 'd', look: L().det(), x: 2500, dir: -1 }],

  // ------------------------------------------------ WINNER stats screen
  R6.WinnerScene = function (next) {

        if (this.t > 4) R6.UI.text(ctx, '+' + reward + ' FICHAS PARA A LOJA EXTRA', 640, 660, { size: 16, align: 'center', color: '#e8336d', weight: 800 });
        if (this.t > 3) R6.UI.text(ctx, 'ENTER para continuar', 640, 700, { size: 14, align: 'center', color: '#777' });

  // ------------------------------------------------ farewell (complex left behind) + credits with scenes in the background
  R6.FarewellScene = function (next) {

    return R6.cutscene({

      onUpdate: (sc, dt) => { isl.zoom = Math.max(0.25, isl.zoom - dt * 0.05); isl.panX -= dt * 8; isl.dawn = Math.min(1, isl.dawn + dt * 0.03); },

  const CREDITS = [
    ['ROUND 6: THE LAST GAME', ''], ['UM JOGO 2D INSPIRADO NO UNIVERSO DE ROUND 6 / SQUID GAME', ''], ['', ''],
    ['DIREÇÃO E DESIGN DE JOGO', 'Claude Code'], ['PROGRAMAÇÃO DE MOTOR', 'Canvas 2D · JavaScript puro'], ['ARTE PROCEDURAL DE PERSONAGENS', 'Esqueleto articulado · 3 vistas · 30+ animações'],
    ['INTELIGÊNCIA ARTIFICIAL', 'Rotinas sociais · memória · alianças · traição · pânico'], ['ÁUDIO', 'Síntese procedural WebAudio · trilhas originais'],
    ['JOGOS', 'Ddakji · Batatinha Frita · Dalgona · Cabo de Guerra · Bolinhas de Gude · Ponte de Vidro · Squid Game'], ['', 'Pão ou Loteria · Pedra, Papel e Tesoura: Menos Um · Seis Pernas · Mingle · A Revolta'], ['', 'Esconde-Esconde · Pular Corda · Sky Squid Game · A Fuga'],
    ['JOGOS EXTRAS ORIGINAIS', 'Clock Run · Color Rooms · Number Hunt · Falling Tiles · Freeze Challenge'],
    ['PERSONAGENS ORIGINAIS', 'Yoo Il-hwan · Seo Tae-min · Kang Ha-eun · Rafiq Hossain · Jang Deok-man · Oh Mi-ja'], ['', 'Baek Jin-woo · Tak Man-su · Yoon Ha-ri · Min Ji-a · Choi Dae-han · Detetive Kang'],
    ['E TODOS OS 456', 'que nunca voltaram para casa.'], ['', ''], ['Obra de fã, sem afiliação com a Netflix ou os criadores da série.', ''], ['OBRIGADO POR JOGAR', ''],

  R6.CreditsScene = function (next) {
    const vignettes = ['doll', 'glass', 'tug', 'towers', 'marbles', 'mingle'];
    const extras = R6.Char;
    return {
      name: 'credits', t: 0, pausable: false, y: R6.H + 40, look: S().s ? S().s.player.look : R6.Char.makeLook({ num: 456 }),
      looks: Array.from({ length: 12 }, (_, i) => R6.Char.makeLook({ seed: 40 + i, num: 40 + i })),

      update(dt) { this.t += dt; this.y -= dt * (R6.Input.act('action') ? 160 : 42); if ((this.y < -CREDITS.length * 56 - 200 || R6.Input.actP('back')) && !this.left) { this.left = true; next(); } },
      render(ctx) {

        // background scene vignettes cycling (scenes from the game)

        ctx.save(); ctx.globalAlpha = a; ctx.translate(900, 420);

        else if (v === 'glass') { for (let i = -3; i <= 3; i++) R6.Props.glassPanel(ctx, i * 80 - 30, 100, 70, 20, { broken: i === 1, glint: 0.3 }); R6.Char.draw(ctx, this.look, 10, 104, { view: 'side', anim: 'jump', t, scale: 1.1 }); }
        else if (v === 'tug') { for (let i = 0; i < 4; i++) R6.Char.draw(ctx, this.looks[i], -200 + i * 60, 150, { view: 'side', dir: 1, anim: 'pull', t: t + i, scale: 1 }); ctx.strokeStyle = '#b89a62'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-260, 90); ctx.lineTo(220, 90); ctx.stroke(); }
        else if (v === 'towers') { for (let i = 0; i < 3; i++) { ctx.fillStyle = '#8a93a0'; ctx.fillRect(-260 + i * 200, 40 - i * 30, 90, 400); R6.UI.shapeIcon(ctx, ['square', 'triangle', 'circle'][i], -215 + i * 200, 120 - i * 30, 26, '#fff', 4); } }
        else if (v === 'marbles') { for (let i = 0; i < 10; i++) R6.drawMarble(ctx, -120 + i * 26, 120 + Math.sin(t * 2 + i) * 6, 11, ['#7fc4ff', '#ff7fa8', '#ffd166'][i % 3]); R6.Char.draw(ctx, this.look, -200, 200, { view: 'side', anim: 'hold', t, scale: 1.3 }); }
        else { ctx.fillStyle = '#8a5a9a'; ctx.beginPath(); ctx.ellipse(0, 150, 260, 90, 0, 0, U.TAU); ctx.fill(); for (let i = 0; i < 8; i++) R6.Char.draw(ctx, this.looks[4 + i], Math.cos(t * 0.5 + i) * 180, 150 + Math.sin(t * 0.5 + i) * 60, { view: 'front', anim: 'walk', t: t + i, scale: 0.6 }); }
        ctx.restore();
        let y = this.y;
        for (const [a, b] of CREDITS) {
          if (y > -60 && y < R6.H + 60) {
            if (a) R6.UI.text(ctx, a, 380, y, { size: a === 'ROUND 6: THE LAST GAME' || a === 'OBRIGADO POR JOGAR' ? 40 : 18, fam: a.length < 30 && !b ? 'title' : 'body', align: 'center', weight: 800, color: b ? '#e8336d' : '#fff', spacing: 2 });
            if (b) R6.UI.text(ctx, b, 380, y + 24, { size: 17, align: 'center', color: '#ddd', maxW: 700 });
          }
          y += 56;
        }
        R6.UI.vignette(ctx, 0.7);
        R6.UI.text(ctx, 'ESPAÇO acelera · ESC pula', R6.W - 20, R6.H - 16, { size: 12, align: 'right', color: '#555' });
      },
    };
  };
})();

<script>/* js/scenes/menu.js */
/* ROUND 6 — menu.js : animated dormitory backdrop (bunk towers, hanging piggy bank filling with money, guards, participants,
   flickering lamps, dust, falling bills), the title screen and the main menu; shared frame for the meta screens */
'use strict';
(function () {
  const U = R6.U, TAU = U.TAU;
  const BGW = 2400;

  // ------------------------------------------------ static painted dorm layer (cached)
  function paintDorm(c, w, h) {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#141d21'); g.addColorStop(0.55, '#1f2c30'); g.addColorStop(1, '#263337');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // faint pastel stairs on the far wall (the maze of stairs above the dorm)
    const r = new U.RNG(456);
    const cols = ['#f4b6c8', '#a9d8e8', '#f7df8e', '#b8e0b0'];
    for (let k = 0; k < 9; k++) {
      let x = k * 280 + r.int(0, 60), y = r.int(30, 120); const dir = r.chance(0.5) ? 1 : -1; const n = r.int(5, 9);
      c.globalAlpha = 0.1;
      for (let i = 0; i < n; i++) { c.fillStyle = cols[(k + i) % 4]; c.fillRect(x, y, 26, 10); c.fillStyle = 'rgba(0,0,0,.4)'; c.fillRect(x, y + 10, 26, 3); x += 22 * dir; y += 9; }
      c.globalAlpha = 1;
    }
    // bunk towers: far row then near row
    const drawTower = (x, base, s, dark) => {
      const lv = 6, lh = 70 * s, tw = 150 * s, top = base - lv * lh;
      const post = U.shade('#8f9aa3', -dark), postHi = U.shade('#b7c1c8', -dark);
      for (let i = 0; i < lv; i++) {
        const y = top + i * lh;
        // bed platform
        c.fillStyle = U.shade('#6f7a82', -dark); c.fillRect(x, y + lh - 10 * s, tw, 10 * s);
        c.fillStyle = U.shade('#dfe3e0', -dark); c.fillRect(x + 4 * s, y + lh - 22 * s, tw - 8 * s, 12 * s);
        // occupant: pillow + head + blanket mound (some beds empty)
        if (r.chance(0.62)) {
          c.fillStyle = U.shade('#f4f4ef', -dark); c.fillRect(x + 8 * s, y + lh - 30 * s, 22 * s, 9 * s);
          c.fillStyle = U.shade(U.pick(R6.Char.SKINS.slice(0, 6)), -dark); c.beginPath(); c.arc(x + 22 * s, y + lh - 30 * s, 7 * s, 0, TAU); c.fill();
          c.fillStyle = U.shade('#1d1612', -dark); c.beginPath(); c.arc(x + 22 * s, y + lh - 33 * s, 7 * s, Math.PI, TAU); c.fill();
          c.fillStyle = U.shade('#2b7d71', -dark); c.beginPath(); c.moveTo(x + 30 * s, y + lh - 22 * s); c.quadraticCurveTo(x + 70 * s, y + lh - 42 * s, x + tw - 14 * s, y + lh - 22 * s); c.closePath(); c.fill();
        } else if (r.chance(0.5)) { c.fillStyle = U.shade('#2b7d71', -dark - 0.1); c.fillRect(x + 50 * s, y + lh - 26 * s, 40 * s, 5 * s); }
      }
      // posts, rails & ladder
      c.fillStyle = post; c.fillRect(x - 4 * s, top - 8 * s, 7 * s, base - top + 8 * s); c.fillRect(x + tw - 3 * s, top - 8 * s, 7 * s, base - top + 8 * s);
      c.fillStyle = postHi; c.fillRect(x - 3 * s, top - 8 * s, 2 * s, base - top + 8 * s);
      for (let i = 0; i <= lv; i++) { c.fillStyle = post; c.fillRect(x - 4 * s, top + i * lh - 12 * s, tw + 8 * s, 4 * s); }
      const lx = x + tw + 6 * s;
      c.fillStyle = post; c.fillRect(lx, top, 3 * s, base - top); c.fillRect(lx + 16 * s, top, 3 * s, base - top);
      for (let y = top + 10 * s; y < base; y += 16 * s) c.fillRect(lx, y, 19 * s, 2.5 * s);
    };
    for (let x = -40; x < w; x += 170) drawTower(x, 520, 0.62, 0.35);
    // haze between rows
    c.fillStyle = 'rgba(20,29,33,.55)'; c.fillRect(0, 0, w, 540);
    for (let x = 20; x < w; x += 250) drawTower(x, 612, 1, 0.08);
    // floor
    const fg = c.createLinearGradient(0, 600, 0, h); fg.addColorStop(0, '#4a4640'); fg.addColorStop(1, '#2a2723');
    c.fillStyle = fg; c.fillRect(0, 606, w, h - 606);
    c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 1;
    for (let y = 620; y < h; y += 18 + (y - 600) * 0.12) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
    for (let x = 0; x < w; x += 64) { c.beginPath(); c.moveTo(x, 606); c.lineTo(x + (x % 128 ? -20 : 20), h); c.stroke(); }
    c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(0, 604, w, 4);
  }

  // ------------------------------------------------ animated background
  class MenuBG {
    constructor() {
      this.t = 0; this.fx = new R6.Particles(260); this.bills = []; this.flick = [1, 1, 1, 1, 1, 1];
      this.dust = Array.from({ length: 60 }, () => ({ x: U.rand(0, R6.W), y: U.rand(0, R6.H), v: U.rand(4, 14), p: U.rand(0, TAU) }));
      this.walkers = [];
      const r = new U.RNG(2024);
      const add = (o) => this.walkers.push(Object.assign({ x: r.range(0, BGW), dir: r.chance(0.5) ? 1 : -1, sp: r.range(26, 46), anim: 'walk', t0: r.range(0, 10) }, o));
      for (let i = 0; i < 9; i++) { const num = r.int(2, 455); add({ look: R6.Char.makeLook({ num, seed: 300 + i }, r), y: r.range(632, 700), s: r.range(0.95, 1.2) }); }
      for (let i = 0; i < 5; i++) { const num = r.int(2, 455); add({ look: R6.Char.makeLook({ num, seed: 400 + i }, r), y: r.range(606, 618), s: r.range(0.6, 0.7) }); }
      // groups that stand still
      const a = R6.Char.makeLook({ num: 212, seed: 81 }, r), b = R6.Char.makeLook({ num: 67, seed: 82 }, r);
      add({ look: a, x: 700, y: 660, s: 1.05, anim: 'talk', dir: 1, sp: 0, still: true }); add({ look: b, x: 760, y: 662, s: 1.02, anim: 'argue', dir: -1, sp: 0, still: true });
      add({ look: R6.Char.makeLook({ num: 1, age: 2, hs: 'perm', hair: '#a9a6a0', seed: 83 }, r), x: 1500, y: 668, s: 1.0, anim: 'sitSad', dir: 1, sp: 0, still: true });
      add({ look: R6.Char.makeLook({ num: 199, seed: 84 }, r), x: 1180, y: 650, s: 1.0, anim: 'look', dir: 1, sp: 0, still: true, view: 'back' });
      // guards patrol with rifles
      ['circle', 'triangle', 'square'].forEach((m, i) => add({ look: R6.Char.makeLook({ outfit: 'guard', mask: m, seed: 90 + i }), y: 646 + i * 18, s: 1.08, sp: 24, item: 'rifle', guard: true, x: 400 + i * 800 }));
      this.walkers.sort((p, q) => p.y - q.y);
    }
    update(dt) {
      this.t += dt; this.fx.update(dt);
      for (const w of this.walkers) {
        if (w.still) continue;
        if (w.pause > 0) { w.pause -= dt; if (w.pause <= 0) w.dir *= -1; continue; }
        w.x += w.dir * w.sp * dt;
        if (w.x < -100) w.x += BGW + 200; if (w.x > BGW + 100) w.x -= BGW + 200;
        if (w.guard && Math.random() < dt * 0.05) w.pause = U.rand(1.5, 3.5);
      }
      for (let i = 0; i < this.flick.length; i++) { if (Math.random() < dt * 0.08) this.flick[i] = U.rand(0.1, 0.5); this.flick[i] = U.approach(this.flick[i], 1, dt * 2.5); }
      // bills falling into the piggy bank
      if (Math.random() < dt * 5) this.bills.push({ x: U.rand(-40, 40), y: -40, vy: U.rand(90, 140), r: U.rand(0, TAU), vr: U.rand(-3, 3) });
      for (const b of this.bills) { b.y += b.vy * dt; b.r += b.vr * dt; b.x += Math.sin(this.t * 3 + b.r) * 10 * dt; }
      this.bills = this.bills.filter(b => b.y < 150);
      if (Math.random() < dt * 0.9) this.fx.emit('money', U.rand(0, R6.W), -20, 1);
      for (const d of this.dust) { d.y += d.v * dt * 0.3; d.x += Math.sin(this.t * 0.5 + d.p) * 6 * dt; if (d.y > R6.H) { d.y = -5; d.x = U.rand(0, R6.W); } }
    }
    draw(ctx, o = {}) {
      const t = this.t;
      const img = R6.Env.cached('menu_dorm', BGW, R6.H, paintDorm);
      const off = (t * 9) % BGW;
      ctx.drawImage(img, -off, 0); ctx.drawImage(img, BGW - off, 0);
      // piggy bank (fixed focal point) with money stream
      const px = o.pigX || 900, py = 250 + Math.sin(t * 0.7) * 4;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const gl = ctx.createRadialGradient(px, py, 20, px, py, 320); gl.addColorStop(0, 'rgba(255,205,110,.28)'); gl.addColorStop(1, 'rgba(255,205,110,0)');
      ctx.fillStyle = gl; ctx.fillRect(px - 320, py - 320, 640, 640);
      ctx.restore();
      ctx.strokeStyle = '#7a8088'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px, -10); ctx.lineTo(px, py - 72); ctx.stroke();
      for (const b of this.bills) { ctx.save(); ctx.translate(px + b.x * 0.4, b.y + py - 200); ctx.rotate(b.r); ctx.fillStyle = '#e1c46e'; ctx.fillRect(-9, -4, 18, 8); ctx.fillStyle = '#b89a45'; ctx.fillRect(-3, -3, 6, 6); ctx.restore(); }
      const fill = U.clamp(0.3 + (R6.Save.meta.totalEarned || 0) / 6000, 0.3, 0.95);
      R6.Props.piggy(ctx, px, py, 68, fill, t, { cable: 0 });
      // ceiling lamps & light cones
      for (let i = 0; i < 6; i++) {
        const lx = 110 + i * 215, k = this.flick[i];
        ctx.fillStyle = U.rgba('#fff8e0', 0.5 + k * 0.5); ctx.fillRect(lx - 34, 14, 68, 6);
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.07 * k;
        const cg = ctx.createLinearGradient(0, 20, 0, 700); cg.addColorStop(0, '#fff3cf'); cg.addColorStop(1, 'rgba(255,243,207,0)');
        ctx.fillStyle = cg; ctx.beginPath(); ctx.moveTo(lx - 34, 20); ctx.lineTo(lx + 34, 20); ctx.lineTo(lx + 170, 700); ctx.lineTo(lx - 170, 700); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      // walkers (world scrolls slightly faster than the backdrop: parallax)
      const woff = (t * 12.5) % BGW;
      for (const w of this.walkers) {
        let x = w.x - woff; if (x < -120) x += BGW; if (x < -120 || x > R6.W + 120) continue;
        const moving = !w.still && !(w.pause > 0);
        R6.Char.draw(ctx, w.look, x, w.y, { view: w.view || 'side', dir: w.dir, anim: moving ? 'walk' : w.anim === 'walk' ? 'idle' : w.anim, t: t + w.t0, scale: w.s, item: w.item, shadowA: 0.35 });
      }
      this.fx.draw(ctx);
      // dust motes in the light
      ctx.fillStyle = 'rgba(255,245,220,.35)';
      for (const d of this.dust) { ctx.globalAlpha = 0.2 + Math.sin(t + d.p) * 0.15; ctx.fillRect(d.x, d.y, 2, 2); }
      ctx.globalAlpha = 1;
      if (o.dim) { ctx.fillStyle = 'rgba(4,5,8,' + o.dim + ')'; ctx.fillRect(0, 0, R6.W, R6.H); }
      if (o.leftShade !== false) {
        const lg = ctx.createLinearGradient(0, 0, 640, 0); lg.addColorStop(0, 'rgba(4,5,8,.88)'); lg.addColorStop(0.7, 'rgba(4,5,8,.35)'); lg.addColorStop(1, 'rgba(4,5,8,0)');
        ctx.fillStyle = lg; ctx.fillRect(0, 0, 640, R6.H);
      }
      R6.UI.vignette(ctx, 0.75);
    }
  }
  R6.MenuBG = MenuBG;
  R6.menuBG = () => (R6._menuBG = R6._menuBG || new MenuBG());

  // ------------------------------------------------ campaign chapter labels (continue card, pause menu)
  const G = { g_ddakji: 'ddakji', g_redlight: 'redlight', g_dalgona: 'dalgona', g_tug: 'tugofwar', g_marbles: 'marbles', g_glass: 'glassbridge', g_squid: 'squidfinal', g_bread: 'breadlottery', g_rps: 'rps', g_redlight2: 'redlight2', g_sixlegs: 'sixlegs', g_mingle: 'mingle', g_revolt: 'revolt', g_hideseek: 'hideseek', g_jumprope: 'jumprope', g_skysquid: 'skysquid', g_escape: 'escape' };
  const LBL = { s1_intro: 'Prólogo · A Estação', s1_card: 'O Cartão', h1_arrival: 'Dormitório · Dia 1', h1_vote: 'A Votação', s1_home: 'De Volta à Cidade', h1_day2: 'Dormitório · Dia 2', h1_night: 'A Noite do Motim', h1_tug: 'Formando Equipes', h1_after_tug: 'Dormitório · Dia 4', h1_glass: 'Dormitório · Dia 5', s1_dinner: 'O Jantar', s1_clause3: 'Cláusula 3', s1_end: 'Fim da Temporada 1', s2_season: 'Temporada 2 · O Retorno', s2_arrival: 'A Chegada', h2_arrival: 'Temporada 2 · Dia 1', h2_vote1: 'Votação', h2_day: 'O contra X', h2_vote2: 'Votação', h2_vote3: 'A Última Votação', s2_end: 'Fim da Temporada 2', s3_season: 'Temporada 3', h3_1: 'Temporada 3 · Dia 1', s3_after_hs: 'Depois do Esconde-Esconde', h3_2: 'Temporada 3 · Dia 2', s3_dinner: 'O Jantar Final', victory: 'Vitória', ending: 'Final', winner: 'Winner', farewell: 'Despedida', credits: 'Créditos' };
  R6.chapterLabel = function (id) { if (G[id] && R6.Games[G[id]]) return R6.Games[G[id]].name; return LBL[id] || id || '—'; };

  // ------------------------------------------------ shared frame for meta screens
  // R6.metaScene({ name, title, sub, update(dt, sc), render(ctx, sc), back: fn })
  R6.metaScene = function (o) {
    const sc = {
      name: o.name || 'meta', t: 0, pausable: false, bg: R6.menuBG(),
      enter() { R6.Campaign && (R6.Campaign.active = false); R6.Music.play(o.music || menuTrack()); o.enter && o.enter(sc); },
      exit() { o.exit && o.exit(sc); },
      update(dt) {
        sc.t += dt; sc.bg.update(dt);
        if (R6.Dialog.active) { sc.cool = 0.2; return; }
        if (sc.cool > 0) { sc.cool -= dt; return; }
        if (o.update && o.update(dt, sc) === 'stop') return;
        if (!sc.noBack && R6.Input.actP('back') && o.back !== false) { R6.Audio.sfx('back'); (o.back || (() => R6.Engine.go(R6.MenuScene(), { t: 'fade', dur: 0.6 })))(); }
      },
      render(ctx) {
        sc.bg.draw(ctx, { dim: o.dim != null ? o.dim : 0.55, leftShade: false });
        const k = U.ease.outCubic(Math.min(1, sc.t * 3));
        R6.UI.text(ctx, o.title || '', 60 - (1 - k) * 30, 76, { size: 54, fam: 'title', color: '#fff', spacing: 4, alpha: k, shadow: true });
        if (o.sub) R6.UI.text(ctx, o.sub, 62, 104, { size: 16, color: '#aaa', weight: 600, spacing: 2, alpha: k });
        ctx.fillStyle = R6.UI.T.accent; ctx.fillRect(60, 116, 140 * k, 3);
        chipsBadge(ctx);
        o.render && o.render(ctx, sc);
        if (o.hints !== false) R6.UI.hints(ctx, o.hints || [['↑↓←→', 'navegar'], ['ENTER', 'confirmar'], ['ESC', 'voltar']], 60, R6.H - 26, {});
      },
    };
    return sc;
  };
  function chipsBadge(ctx) {
    const txt = U.commas ? U.commas(R6.Save.meta.chips) : String(R6.Save.meta.chips);
    const w = R6.UI.measure(ctx, txt, 22, 700, 'mono') + 70;
    R6.UI.panel(ctx, R6.W - w - 24, 34, w, 40, { r: 20, fill: 'rgba(8,10,14,.8)', shadow: false });
    R6.UI.shapeIcon(ctx, 'circle', R6.W - w - 2, 54, 11, '#f2c14e', 3);
    R6.UI.shapeIcon(ctx, 'circle', R6.W - w - 2, 54, 5, '#e8336d', 0, true);
    R6.UI.text(ctx, txt, R6.W - 40, 62, { size: 22, fam: 'mono', color: '#f2c14e', align: 'right' });
    R6.UI.text(ctx, 'FICHAS', R6.W - w - 24 + w / 2, 88, { size: 11, color: '#888', align: 'center', weight: 800, spacing: 3 });
  }
  R6.chipsBadge = chipsBadge;
  function menuTrack() { const eq = R6.Save.meta.equipped.track; const it = R6.SHOP && R6.SHOP.find(i => i.id === eq); return (it && it.track) || 'menu'; }
  R6.menuTrack = menuTrack;

  // simple modal confirm on top of meta scenes (uses the dialogue system for consistent look & input)
  R6.confirm = function (text, yes, no, o = {}) {
    R6.Dialog.show({ who: { name: o.who || 'SISTEMA', look: o.look || R6.Char.makeLook({ outfit: 'guard', mask: 'square', seed: 7 }) }, text, choices: [
      { t: o.yes || 'Sim', color: '#e8336d', cb: () => yes && yes() },
      { t: o.no || 'Não', cb: () => no && no() },
    ] });
  };

  // ------------------------------------------------ MAIN MENU
  R6.MenuScene = function () {
    const hasSave = () => R6.Save.hasCampaign();
    const saveInfo = () => { const d = R6.Save.readCampaign(); if (!d || !d.state) return null; return { season: d.state.season, chapter: d.label, name: d.state.player.name, num: d.state.player.num, look: d.state.player.look, prize: d.state.prize, at: d.savedAt }; };
    const go = sc => R6.Engine.go(sc, { t: 'fade', dur: 0.7 });
    const newGame = () => { if (hasSave()) R6.confirm('Existe um jogo salvo. Começar um NOVO JOGO vai apagar o progresso atual da campanha. Continuar?', () => go(R6.CreationScene({ season: 1 }))); else go(R6.CreationScene({ season: 1 })); };
    const cont = () => { if (!hasSave()) { R6.Audio.sfx('error'); return; } R6.Engine.go({ name: 'loading', enter() { }, update() { }, render(ctx) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, R6.W, R6.H); } }, { t: 'cut' }); R6.Campaign.continueSave(); };
    const items = [
      { label: 'JOGAR', icon: 'circle', sub: () => hasSave() ? 'continuar' : 'novo jogo', action: () => hasSave() ? cont() : newGame() },
      { label: 'CONTINUAR', icon: 'triangle', disabled: !hasSave(), sub: () => { const s = saveInfo(); return s ? 'T' + s.season + ' · ' + R6.chapterLabel(s.chapter) : ''; }, action: cont },
      { label: 'NOVO JOGO', icon: 'square', action: newGame },
      { label: 'SELEÇÃO DE TEMPORADA', icon: 'circle', sub: () => R6.Save.meta.seasonsUnlocked + '/3', action: () => go(R6.SeasonSelectScene()) },
      { label: 'SELEÇÃO DE JOGO', icon: 'triangle', sub: () => Object.keys(R6.Save.meta.gamesUnlocked).filter(k => R6.Games[k]).length + '/' + Object.keys(R6.Games).filter(k => !R6.Games[k].hidden).length, action: () => go(R6.GameSelectScene()) },
      { label: 'DESAFIOS EXTRAS', icon: 'square', sub: () => (R6.EXTRAS ? R6.EXTRAS.length : 0) + ' jogos', action: () => go(R6.ExtrasScene()) },
      { label: 'LOJA', icon: 'circle', sub: 'cosméticos', action: () => go(R6.ShopScene()) },
      { label: 'GALERIA', icon: 'triangle', sub: () => Object.keys(R6.Save.meta.endings).length + '/' + Object.keys(R6.ENDINGS || {}).length + ' finais', action: () => go(R6.GalleryScene()) },
      { label: 'CONFIGURAÇÕES', icon: 'square', action: () => go(R6.SettingsScene()) },
      { label: 'CRÉDITOS', icon: 'circle', action: () => go(R6.CreditsScene(() => go(R6.MenuScene()))) },
    ];
    const sc = {
      name: 'menu', t: 0, pausable: false, bg: R6.menuBG(), mode: R6._menuSeen ? 'menu' : 'title', mk: R6._menuSeen ? 1 : 0,
      menu: new R6.UI.Menu(items, { start: hasSave() ? 0 : 0 }),
      enter() {
        if (R6.Campaign) R6.Campaign.active = false;
        R6.Music.play(menuTrack()); R6.Music.setIntensity(0.2); R6.Audio.loop('hum', 0.25);
        R6.Elim && R6.Elim.reset();
      },
      update(dt) {
        this.t += dt; this.bg.update(dt);
        if (this.mode === 'title') {
          if (this.t > 0.8 && (R6.Input.anyP())) { this.mode = 'menu'; R6._menuSeen = true; R6.Audio.sfx('confirm'); R6.Audio.sfx('whoosh', { vol: 0.4 }); R6.Input.clearAll(); }
          return;
        }
        this.mk = Math.min(1, this.mk + dt * 1.8);
        if (R6.Dialog.active) { this.cool = 0.2; return; }
        if (this.cool > 0) { this.cool -= dt; return; }
        if (this.mk > 0.6) this.menu.update(dt);
      },
      render(ctx) {
        const t = this.t;
        this.bg.draw(ctx, { dim: this.mode === 'title' ? 0.25 : 0, pigX: U.lerp(1090, 900, U.ease.inOutCubic(this.mk)) });
        const mk = U.ease.inOutCubic(this.mk);
        // logo: centered on the title screen, slides to the corner for the menu
        const lx = U.lerp(640, 270, mk), ly = U.lerp(280, 86, mk), ls = U.lerp(120, 66, mk);
        const intro = U.clamp(t / 1.2, 0, 1);
        ctx.save(); ctx.globalAlpha = intro;
        R6.UI.logo(ctx, lx, ly, ls * (0.9 + 0.1 * U.ease.outBack(intro)), t, { sub: 'THE LAST GAME' });
        ctx.restore();
        if (this.mode === 'title') {
          const a = 0.5 + Math.sin(t * 3) * 0.5;
          if (t > 1) R6.UI.text(ctx, R6.Touch && R6.Touch.isTouch ? 'TOQUE PARA COMEÇAR' : 'PRESSIONE QUALQUER TECLA', 640, 520, { size: 22, align: 'center', color: '#fff', alpha: a * Math.min(1, t - 1), spacing: 6, weight: 700, shadow: true });
          R6.UI.text(ctx, '456 PARTICIPANTES · 1 VENCEDOR · ₩45.600.000.000', 640, 470, { size: 16, align: 'center', color: '#e8c46a', alpha: intro * 0.9, spacing: 3, weight: 700 });
          R6.UI.text(ctx, 'Obra de fã, inspirada em Round 6 / Squid Game. Sem afiliação oficial.', 640, 690, { size: 12, align: 'center', color: '#666' });
          return;
        }
        ctx.save(); ctx.globalAlpha = mk; ctx.translate(-(1 - mk) * 60, 0);
        this.menu.draw(ctx, 64, 168, 420, 40, 6, { size: 19 });
        ctx.restore();
        R6.chipsBadge(ctx);
        // continue card
        const s = saveInfo();
        if (s && this.menu.i <= 1) {
          const x = R6.W - 380, y = R6.H - 190;
          R6.UI.panel(ctx, x, y, 350, 130, { fill: 'rgba(6,8,12,.86)', accent: true, alpha: mk });
          R6.Char.portrait(ctx, s.look, x + 60, y + 65, 90, 'determined', t, false);
          R6.UI.text(ctx, 'JOGO SALVO', x + 118, y + 30, { size: 12, color: '#999', weight: 800, spacing: 3 });
          R6.UI.text(ctx, '#' + U.pad(s.num) + '  ' + s.name, x + 118, y + 56, { size: 20, weight: 800, color: '#fff', maxW: 220 });
          R6.UI.text(ctx, 'TEMPORADA ' + s.season + ' · ' + R6.chapterLabel(s.chapter), x + 118, y + 80, { size: 14, color: '#e8336d', weight: 700, maxW: 220 });
          R6.UI.text(ctx, 'PRÊMIO ' + U.money(s.prize || 0), x + 118, y + 104, { size: 14, fam: 'mono', color: '#f2c14e' });
        }
        // ticker
        const msg = '   ●  456 JOGADORES   ▲  1 VENCEDOR   ■  ₩100.000.000 POR ELIMINADO   ●  ' + (R6.Save.meta.stats.eliminatedSeen || 0) + ' ELIMINAÇÕES TESTEMUNHADAS   ▲  ' + Object.keys(R6.Save.meta.endings).length + ' FINAIS DESCOBERTOS   ■  VOCÊ JOGA. NÓS ASSISTIMOS.';
        ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, R6.H - 28, R6.W, 28);
        const tw = R6.UI.measure(ctx, msg, 13, 700); const off = (t * 50) % tw;
        for (let x = -off; x < R6.W; x += tw) R6.UI.text(ctx, msg, x, R6.H - 9, { size: 13, color: '#bbb', weight: 700 });
        R6.UI.text(ctx, 'v1.0', R6.W - 12, R6.H - 36, { size: 11, align: 'right', color: '#555' });
      },
    };
    return sc;
  };
})();
